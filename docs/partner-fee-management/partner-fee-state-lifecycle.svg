<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" flood-color="#0F172A" />
    </filter>
  </defs>

  <!-- TITLE BLOCK -->
  <g id="Title">
    <text x="50" y="48" font-size="22" font-weight="700" fill="#0F172A">SƠ ĐỒ VÒNG ĐỜI TRẠNG THÁI CẤU HÌNH PHÍ ĐỐI TÁC</text>
    <text x="50" y="74" font-size="14" fill="#64748B">Hệ thống Quản lý Biểu phí Đối tác &amp; Cổng thanh toán (Partner Fee Configuration Lifecycle)</text>
    <line x1="50" y1="90" x2="1230" y2="90" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- ==================== CONNECTIONS / ARROWS ==================== -->
  <g id="Transitions" stroke-width="1.8" fill="none">
    
    <!-- Start -> DRAFT -->
    <path d="M 90 190 L 178 190" stroke="#2563EB" marker-end="url(#arrow-blue)" />
    
    <!-- DRAFT -> NEW -->
    <path d="M 340 190 L 448 190" stroke="#16A34A" marker-end="url(#arrow-green)" />
    
    <!-- DRAFT -> DELETED -->
    <path d="M 260 225 L 260 365 L 348 365" stroke="#DC2626" marker-end="url(#arrow-red)" />
    
    <!-- NEW -> DELETED -->
    <path d="M 500 225 L 500 340 L 460 340" stroke="#DC2626" marker-end="url(#arrow-red)" />
    
    <!-- NEW -> READY (Approved: future date) -->
    <path d="M 610 175 L 728 175" stroke="#D97706" marker-end="url(#arrow-amber)" />
    

    
    <!-- NEW -> NEW (Rejected) -->
    <path d="M 490 155 C 490 95, 560 95, 560 155" stroke="#EF4444" marker-end="url(#arrow-red)" />
    
    <!-- READY -> ACTIVE (Auto-Golive Job) -->
    <path d="M 810 225 L 810 328" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrow-green)" />
    
    <!-- READY -> NEW (Reset config) -->
    <path d="M 760 155 C 760 110, 590 110, 590 153" stroke="#64748B" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    
    <!-- ACTIVE -> INACTIVE (Pause) -->
    <path d="M 780 405 L 780 528" stroke="#EA580C" marker-end="url(#arrow)" />
    
    <!-- INACTIVE -> ACTIVE (Resume) -->
    <path d="M 840 530 L 840 407" stroke="#16A34A" marker-end="url(#arrow-green)" />
    
    <!-- ACTIVE -> EXPIRED -->
    <path d="M 900 365 L 1028 365" stroke="#64748B" marker-end="url(#arrow)" />
    
    <!-- INACTIVE -> EXPIRED -->
    <path d="M 890 565 L 1080 565 L 1080 400" stroke="#64748B" marker-end="url(#arrow)" />
    
    <!-- READY -> EXPIRED -->
    <path d="M 890 190 L 1080 190 L 1080 328" stroke="#64748B" stroke-dasharray="4,4" marker-end="url(#arrow)" />

    <!-- DELETED -> End Terminal -->
    <path d="M 405 395 L 405 458" stroke="#94A3B8" marker-end="url(#arrow)" />

    <!-- EXPIRED -> End Terminal -->
    <path d="M 1155 365 L 1208 365" stroke="#94A3B8" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== TRANSITION LABELS ==================== -->
  <g id="Labels" font-size="12" fill="#334155" text-anchor="middle">
    <!-- Start -> DRAFT -->
    <rect x="98" y="171" width="70" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="133" y="185" fill="#2563EB" font-weight="600">Lưu nháp</text>

    <!-- DRAFT -> NEW -->
    <rect x="348" y="168" width="90" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="393" y="183" font-weight="600" fill="#16A34A">Bấm [Tạo mới +]</text>

    <!-- DRAFT -> DELETED -->
    <rect x="230" y="275" width="60" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="260" y="289" fill="#DC2626">Xóa nháp</text>

    <!-- NEW -> DELETED -->
    <rect x="475" y="275" width="50" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="500" y="289" fill="#DC2626">Xóa bỏ</text>

    <!-- NEW -> READY -->
    <rect x="620" y="148" width="98" height="36" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <text x="669" y="163" fill="#B45309" font-weight="600">Checker Duyệt</text>
    <text x="669" y="177" fill="#78350F" font-size="10">(Chưa quá ngày hiệu lực)</text>

    <!-- NEW -> NEW Rejected -->
    <rect x="475" y="80" width="105" height="22" rx="4" fill="#FEE2E2" stroke="#FECACA" stroke-width="1" />
    <text x="527" y="95" fill="#DC2626" font-size="11" font-weight="600">Từ chối</text>

    <!-- READY -> ACTIVE -->
    <rect x="740" y="260" width="140" height="36" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
    <text x="810" y="275" fill="#15803D" font-weight="600">Job Auto-Golive 00:00</text>
    <text x="810" y="289" fill="#166534" font-size="10">(Khi đến ngày bắt đầu)</text>

    <!-- READY -> NEW -->
    <rect x="625" y="98" width="105" height="20" rx="4" fill="#F1F5F9" />
    <text x="677" y="112" fill="#475569" font-size="11">Maker sửa lại cấu hình</text>

    <!-- ACTIVE -> INACTIVE -->
    <rect x="680" y="455" width="95" height="34" rx="4" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1" />
    <text x="727" y="470" fill="#C2410C" font-weight="600">Tạm dừng</text>
    <text x="727" y="483" fill="#9A3412" font-size="10">(Maker gửi &amp; Duyệt)</text>

    <!-- INACTIVE -> ACTIVE -->
    <rect x="845" y="455" width="95" height="34" rx="4" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1" />
    <text x="892" y="470" fill="#15803D" font-weight="600">Kích hoạt lại</text>
    <text x="892" y="483" fill="#166534" font-size="10">(Maker gửi &amp; Duyệt)</text>

    <!-- EXPIRED LABELS -->
    <rect x="912" y="348" width="105" height="20" rx="4" fill="#F1F5F9" />
    <text x="964" y="362" fill="#475569" font-size="11">Hết ngày hiệu lực</text>
  </g>

  <!-- ==================== STATE NODES ==================== -->
  
  <!-- START NODE -->
  <g id="Node-Start">
    <circle cx="70" cy="190" r="15" fill="#2563EB" />
    <text x="70" y="222" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">Bắt đầu</text>
  </g>

  <!-- DRAFT -->
  <g id="Node-DRAFT" filter="url(#shadow)">
    <rect x="180" y="155" width="160" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="260" y="185" font-size="16" font-weight="700" fill="#1D4ED8" text-anchor="middle">DRAFT</text>
    <text x="260" y="206" font-size="12" fill="#3B82F6" text-anchor="middle">Bản nháp Maker</text>
  </g>

  <!-- NEW -->
  <g id="Node-NEW" filter="url(#shadow)">
    <rect x="450" y="155" width="160" height="70" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2" />
    <text x="530" y="185" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">NEW</text>
    <text x="530" y="206" font-size="12" fill="#16A34A" text-anchor="middle">Tạo mới / Sửa lại</text>
  </g>

  <!-- READY -->
  <g id="Node-READY" filter="url(#shadow)">
    <rect x="730" y="155" width="160" height="70" rx="10" fill="#FEFCE8" stroke="#EAB308" stroke-width="2" />
    <text x="810" y="185" font-size="16" font-weight="700" fill="#A16207" text-anchor="middle">READY</text>
    <text x="810" y="206" font-size="12" fill="#CA8A04" text-anchor="middle">Sẵn sàng / Chờ Golive</text>
  </g>

  <!-- ACTIVE -->
  <g id="Node-ACTIVE" filter="url(#shadow)">
    <rect x="720" y="330" width="180" height="75" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5" />
    <text x="810" y="362" font-size="18" font-weight="800" fill="#14532D" text-anchor="middle">ACTIVE</text>
    <text x="810" y="386" font-size="13" font-weight="600" fill="#15803D" text-anchor="middle">Đang hiệu lực tính phí</text>
  </g>

  <!-- INACTIVE -->
  <g id="Node-INACTIVE" filter="url(#shadow)">
    <rect x="730" y="530" width="160" height="70" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2" />
    <text x="810" y="560" font-size="16" font-weight="700" fill="#C2410C" text-anchor="middle">INACTIVE</text>
    <text x="810" y="581" font-size="12" fill="#EA580C" text-anchor="middle">Tạm dừng hiệu lực</text>
  </g>

  <!-- DELETED -->
  <g id="Node-DELETED" filter="url(#shadow)">
    <rect x="350" y="335" width="110" height="60" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" />
    <text x="405" y="363" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">DELETED</text>
    <text x="405" y="381" font-size="11" fill="#DC2626" text-anchor="middle">Đã xóa bỏ</text>
  </g>

  <!-- EXPIRED -->
  <g id="Node-EXPIRED" filter="url(#shadow)">
    <rect x="1030" y="335" width="125" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8" />
    <text x="1092" y="363" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">EXPIRED</text>
    <text x="1092" y="381" font-size="11" fill="#64748B" text-anchor="middle">Hết hiệu lực</text>
  </g>

  <!-- TERMINAL END NODES -->
  <g id="Node-End-Deleted">
    <circle cx="405" cy="475" r="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
    <circle cx="405" cy="475" r="8" fill="#64748B" />
  </g>

  <g id="Node-End-Expired">
    <circle cx="1225" cy="365" r="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
    <circle cx="1225" cy="365" r="8" fill="#64748B" />
  </g>

  <!-- ==================== LEGEND & BUSINESS RULES ==================== -->
  <g id="Legend" transform="translate(50, 660)">
    <rect x="0" y="0" width="1180" height="120" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="25" y="28" font-size="13" font-weight="700" fill="#1E293B">CHÚ THÍCH &amp; QUY TẮC NGHIỆP VỤ BẢN GHI (BUSINESS RULES):</text>
    
    <!-- Legend item 1 -->
    <rect x="25" y="45" width="16" height="16" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="50" y="58" font-size="12" fill="#334155"><tspan font-weight="600">DRAFT / NEW:</tspan> Trạng thái khởi tạo của Maker, cho phép sửa / xóa tự do trước khi được duyệt.</text>
    
    <!-- Legend item 2 -->
    <rect x="25" y="70" width="16" height="16" rx="4" fill="#FEFCE8" stroke="#EAB308" stroke-width="1.5" />
    <text x="50" y="83" font-size="12" fill="#334155"><tspan font-weight="600">READY:</tspan> Đã được Checker duyệt; nếu Maker ấn sửa lại, hệ thống tự động reset về NEW và phải duyệt lại từ đầu.</text>
    
    <!-- Legend item 3 -->
    <rect x="25" y="95" width="16" height="16" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" />
    <text x="50" y="108" font-size="12" fill="#334155"><tspan font-weight="600">ACTIVE:</tspan> Đang áp dụng tính cước. Tuyệt đối không được sửa / xóa trực tiếp (chỉ được Tạm dừng qua cơ chế 4-mắt).</text>

    <!-- Legend item 4 -->
    <rect x="620" y="45" width="16" height="16" rx="4" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
    <text x="645" y="58" font-size="12" fill="#334155"><tspan font-weight="600">INACTIVE:</tspan> Tạm ngưng tính cước. Khi kích hoạt lại phải được Checker phê duyệt mới trở về ACTIVE.</text>

    <!-- Legend item 5 -->
    <line x1="620" y1="78" x2="636" y2="78" stroke="#16A34A" stroke-width="2.5" />
    <text x="645" y="83" font-size="12" fill="#334155"><tspan font-weight="600">Job Scheduler 00:00:</tspan> Tự động kích hoạt khi đến ngày áp dụng và tự động chuyển EXPIRED khi hết hạn.</text>
  </g>
</svg>
