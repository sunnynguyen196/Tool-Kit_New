<html lang="vi">
<head>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --color-primary: #FCD535;
      --color-canvas: #ffffff;
      --color-surface: #fafafa;
      --color-surface-strong: #f3f3f5;
      --color-ink: #181a20;
      --color-muted: #707a8a;
      --color-hairline: #eaecef;
      --color-link: #2563eb;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      color: var(--color-ink);
      background: var(--color-surface);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow-y: auto;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-hairline);
      padding: 24px 16px;
    }
    aside h2 { font-size: 14px; text-transform: uppercase; color: var(--color-muted); margin: 0 0 12px; letter-spacing: .03em; }
    aside nav ol, aside nav ul { list-style: none; padding: 0; margin: 0; }
    .toc-controls { display: flex; gap: 6px; margin-bottom: 12px; }
    .toc-controls button {
      flex: 1; font-size: 11px; color: var(--color-muted); background: var(--color-surface);
      border: 1px solid var(--color-hairline); border-radius: 6px; padding: 5px 8px; cursor: pointer;
    }
    .toc-controls button:hover { background: var(--color-surface-strong); color: var(--color-ink); }
    /* TOC nested đa cấp (H2→H3→H4) — thụt lề + cỡ chữ theo cấp. */
    aside nav li.toc-item { list-style: none; }
    aside nav li.toc-item > .toc-row { display: flex; align-items: flex-start; border-radius: 6px; }
    aside nav li.toc-item > .toc-row:hover { background: var(--color-surface); }
    aside nav li.toc-item > .toc-row > a { flex: 1; display: block; text-decoration: none; padding: 5px 8px; line-height: 1.4; }
    aside nav .toc-children { margin: 0; padding: 0; }
    aside nav li.collapsed > .toc-children { display: none; }
    /* Cấp 2 (section chính) */
    aside nav > li.toc-item { margin-top: 12px; }
    aside nav > li.toc-item:first-child { margin-top: 0; }
    aside nav > li.toc-item[data-level="2"] > .toc-row > a { font-weight: 600; font-size: 13px; color: var(--color-ink); }
    aside nav > li.toc-item[data-level="2"].active > .toc-row { background: var(--color-primary); }
    /* Cấp 3 */
    aside nav li.toc-item[data-level="3"] { margin-left: 12px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="3"] > .toc-row > a { font-size: 12px; color: var(--color-muted); }
    /* Cấp 4 */
    aside nav li.toc-item[data-level="4"] { margin-left: 22px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="4"] > .toc-row > a { font-size: 11.5px; color: var(--color-muted); opacity: .9; }
    aside nav li.toc-item.active > .toc-row > a { color: var(--color-ink); font-weight: 600; }
    aside nav .toggle { cursor: pointer; user-select: none; color: var(--color-muted); width: 14px; flex: 0 0 14px; text-align: center; padding-top: 5px; transition: transform .15s; }
    aside nav .toggle.leaf { visibility: hidden; }
    aside nav li.collapsed > .toc-row > .toggle { transform: rotate(-90deg); }
    main { padding: 40px 60px; max-width: 1100px; }
    main h1 { font-size: 32px; border-bottom: 2px solid var(--color-ink); padding-bottom: 12px; }
    main h2 { font-size: 24px; margin-top: 40px; border-bottom: 1px solid var(--color-hairline); padding-bottom: 6px; }
    main h3 { font-size: 18px; margin-top: 28px; color: var(--color-ink); }
    main h4 { font-size: 16px; margin-top: 20px; }
    main p, main li { font-size: 14px; }
    main code { font-family: var(--font-mono); font-size: 13px; background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }
    main pre { background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 13px; }
    main pre.mermaid { background: var(--color-canvas); text-align: center; }
    main .mermaid svg { cursor: zoom-in; transition: filter .15s; max-width: 100%; }
    main img.embedded-img { display: block; max-width: 100%; height: auto; margin: 16px auto; }
    main .mermaid svg:hover { filter: drop-shadow(0 0 6px rgba(252, 213, 53, .5)); }
    main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
    main th, main td { border: 1px solid var(--color-hairline); padding: 8px 12px; text-align: left; vertical-align: top; }
    main th { background: var(--color-surface); font-weight: 600; }
    main a { color: var(--color-link); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main hr { border: none; border-top: 1px solid var(--color-hairline); margin: 32px 0; }
    main blockquote { border-left: 4px solid var(--color-primary); margin: 16px 0; padding: 8px 16px; background: var(--color-surface); color: var(--color-muted); }
    main details.inline-screen { border: 1px solid var(--color-hairline); border-radius: 8px; padding: 0; margin: 16px 0; background: var(--color-canvas); overflow: hidden; }
    main details.inline-screen[open] { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    main details.inline-screen > summary { cursor: pointer; padding: 12px 16px; background: var(--color-surface); font-size: 14px; user-select: none; border-bottom: 1px solid transparent; }
    main details.inline-screen[open] > summary { border-bottom-color: var(--color-hairline); }
    main details.inline-screen > summary:hover { background: var(--color-surface-strong); }
    main details.inline-screen > summary code { background: var(--color-canvas); border: 1px solid var(--color-hairline); }
    main details.inline-screen > *:not(summary) { padding-left: 16px; padding-right: 16px; }
    main details.inline-screen pre { margin: 8px 0; }
    .wf-src-tag { font-size: 10px; font-weight: 700; color: #fff; background: #000; border-radius: 3px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
    /* HTML wireframe embed — CSS chi tiết đến từ style GỐC của file wireframe (scope .wf-embed,
       xem extract_scoped_wireframe_css) nên font-size/spacing GIỐNG bản /wireframe-html. Ở đây chỉ
       reset kế thừa + layout container để không bị body preview đè. */
    main .wf-embed { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #000; font-size: 12px; line-height: 1.4; }
    main .wf-embed * { box-sizing: border-box; }
    main .wf-embed .wf-screen { display: inline-block; vertical-align: top; max-width: 100%; }
    main .wf-embed .wf-step-badge { display: none; }
    .meta { color: var(--color-muted); font-size: 13px; margin-bottom: 24px; }
    /* Cover page (export) — khối bìa căn giữa, viền dưới ngăn cách với nội dung. */
    main .cover { text-align: center; padding: 48px 24px 40px; margin-bottom: 24px; border-bottom: 2px solid var(--color-hairline); }
    main .cover h1 { border: none; font-size: 34px; }
    main .cover h2 { border: none; color: var(--color-muted); font-weight: 500; font-size: 17px; margin-top: 4px; }
    main .cover p { font-size: 15px; line-height: 2; }

    /* Mermaid zoom modal */
    .mermaid-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; animation: fadeIn 0.2s ease-out;
    }
    .mermaid-modal.open { display: flex; }
    .modal-svg {
      width: 95vw; height: 90vh; border-radius: 8px;
      background: var(--color-canvas); padding: 2rem; box-sizing: border-box;
      overflow: hidden;
    }
    .modal-svg svg { display: block; max-width: none !important; max-height: none !important; width: 100% !important; height: 100% !important; }
    .modal-toolbar {
      position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10000;
    }
    .modal-toolbar button {
      width: 40px; height: 40px; background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: 6px; font-size: 1.2rem; cursor: pointer; color: var(--color-ink);
    }
    .modal-toolbar button:hover { background: var(--color-surface); }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    footer { padding: 24px 60px; border-top: 1px solid var(--color-hairline); color: var(--color-muted); font-size: 13px; background: var(--color-canvas); }
    footer code { font-family: var(--font-mono); background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--color-hairline); }
      main { padding: 24px; }
      footer { padding: 16px 24px; }
    }
  </style>
</head>

    <aside>
      <h2>Partner Fee Management</h2>
      <div class="meta">SRS Preview · 2026-11-08</div>

          <button type="button" onclick="setAllTocCollapsed(false)">Expand all</button>

  <!-- Mermaid zoom modal -->
  <div id="mermaid-modal" class="mermaid-modal" onclick="if(event.target===this)closeMermaidModal()">
    <div class="modal-toolbar">
      <button onclick="modalPanZoom && modalPanZoom.zoomIn()" title="Zoom in">＋</button>
      <button onclick="modalPanZoom && modalPanZoom.zoomOut()" title="Zoom out">－</button>
      <button onclick="modalPanZoom && (modalPanZoom.resetZoom(), modalPanZoom.center(), modalPanZoom.fit())" title="Reset">⟲</button>

  <footer><p>Workflow: edit MD source → save → chạy <code>python3 _scripts/build-preview.py partner-fee-management</code> để regen → refresh browser.</p></footer>

  <script>
    const OFFLINE = false;
    let modalPanZoom = null;

    // === Markdown parsing (CHỈ online — offline đã render sẵn server-side) ===
    if (!OFFLINE) {
      const MD_SOURCE = "# Partner Fee Management — SRS Preview\n\n> Active work viewer · Generated 2026-11-08\n\n## 1. Tổng quan nhanh\n\n> Liếc nhanh quy mô SRS. Chi tiết từng mục ở section **SRS Spec** bên dưới.\n\n| Loại | Số lượng |\n|---|---|\n| Functional Requirements (FR) | 13 (P0: 11 / P1: 2) |\n| Non-Functional Requirements (NFR) | 5 |\n| Business Rules (BR) | 7 |\n| Error codes | 10 |\n| Success Criteria | 4 |\n| Actors | 5 |\n| Screens | — |\n\n\n## 2. Giới thiệu & Mô tả chung\n\n_Chưa có nội dung shared thật trong `docs/_shared/` (definitions / operating-environment / conventions / system-overview còn là stub)._\n\n\n## <a id=\"sec-spec\"></a>3. SRS Spec\n\n### 1. Scope\n\nTính năng **Quản lý cấu hình phí trả đối tác** (`partner-fee-management`) trên hệ thống **EPAY Portal 2.0** là phân hệ quản trị tập trung toàn bộ các biểu phí mà EPAY phải chi trả cho các Ngân hàng thụ hưởng và Nhà cung cấp kênh thanh toán đối tác (Vietcombank, MBBank, KBank, BIDV, Napas, CyberSource...) khi xử lý giao dịch qua Cổng thanh toán (CTT), QR Gateway (QRGW) và các dịch vụ giá trị gia tăng liên kết.\n\n#### 1.1. Trong phạm vi (In-Scope)\n- **Quản lý danh sách cấu hình phí**: 3 tab trạng thái (*Tất cả*, *Đang hoạt động*, *Chờ phê duyệt*), phân trang, thanh tìm kiếm nhanh và tùy chỉnh cột.\n- **Bộ lọc tra cứu nâng cao 8 tiêu chí**: Hỗ trợ lọc theo đối tác, loại phí, PTTT, cổng TGTT, kỳ trả phí, đồng tiền, nguồn dữ liệu và khoảng thời gian áp dụng (*Từ ngày - Đến ngày* tích hợp DatePicker & TimePicker).\n- **Thêm mới cấu hình phí đầy đủ 4 nhóm nghiệp vụ (8 biến thể màn hình)**:\n  1. *Phí duy trì sử dụng dịch vụ*: Biến thể Áp dụng toàn bộ MID và Biến thể Không áp dụng (Áp dụng riêng từng MID đối tác cung cấp).\n  2. *Phí xử lý giao dịch*: Biến thể Áp dụng chung và Biến thể Không áp dụng (Tách riêng từng loại giao dịch: Thanh toán, Hoàn trả), tích hợp bộ chọn đa mã ngành MCC (Transfer Dual-Listbox).\n  3. *Phí thanh toán*: Biến thể 1 bậc phí và Biến thể Bậc thang nhiều mức phí theo thương hiệu thẻ (Visa, MasterCard, JCB) và Cổng TGTT.\n  4. *Phí quản lý dịch vụ gia tăng (DVGT)*: Biến thể Áp dụng chung và Biến thể Không áp dụng (Tách riêng 3 dịch vụ: Quản lý token, Quản lý rủi ro, FastPay bypass OTP/off 3DS).\n  5. *Biến thể Giao dịch hoàn trả*: Cấu hình phí hoàn trả cho Thẻ quốc tế và Thẻ nội địa.\n- **Công cụ Mô phỏng Tính thử phí 🧮 (Fee Calculation Simulator Popup)**: Hỗ trợ tính toán kiểm thử trước khi gửi duyệt cho cả 01 bậc phí và biểu phí bậc thang theo Tổng SLGD / Tổng GTGD, tự động tính thuế VAT và chặn trần/sàn (Min/Max).\n- **Vòng đời cấu hình & Cơ chế kiểm soát 4 mắt (Maker – Checker)**:\n  - 7 trạng thái bản ghi: `DRAFT`, `NEW`, `PENDING`, `READY`, `ACTIVE`, `INACTIVE`, `DELETED`.\n  - Luồng Maker gửi duyệt; Checker thẩm định so sánh CŨ - MỚI, phê duyệt hoặc từ chối kèm lý do.\n  - Job lập lịch tự động kích hoạt (Auto-Golive) khi chạm mốc thời gian hiệu lực.\n- **Xem chi tiết & Thanh tác vụ nổi (Floating Action Toolbar)**: Xem đầy đủ tham số, chuyển đổi nhanh giữa các tác vụ (Sửa, Xem lịch sử, Gửi duyệt, Tạm dừng, Kích hoạt lại).\n- **Lưu vết kiểm toán (Audit Trail Timeline View)**: Theo dõi toàn bộ lịch sử biến động dữ liệu và trạng thái cấu hình phục vụ đối soát, thanh tra và kiểm toán độc lập.\n\n#### 1.2. Ngoài phạm vi (Out-of-Scope)\n- Động cơ tính cước và cấn trừ thanh toán thực tế định kỳ hàng tháng (thuộc Billing & Settlement Engine backend).\n- Quản lý biểu phí thu từ Khách hàng / ĐVCNTT (thuộc module Phí thu ĐVCNTT và Phí thu Khách hàng riêng biệt).\n- Ký duyệt điện tử CA/OTP ngoài hệ thống Portal nội bộ.\n\n---\n\n### 2. Actors & Stakeholders\n\n| Actor | Loại | Mục tiêu nghiệp vụ | Trong scope? |\n|---|---|---|---|\n| **Maker (Chuyên viên Vận hành / Tính cước EPAY)** | Người dùng nội bộ | Tra cứu, thiết lập mới, cập nhật cấu hình phí, mô phỏng tính thử phí và gửi yêu cầu phê duyệt cho Checker | Có |\n| **Checker (Trưởng phòng / Cán bộ Phê duyệt EPAY)** | Người dùng nội bộ | Thẩm định tính chính xác của biểu phí so với hợp đồng (đối chiếu Cũ - Mới), phê duyệt hoặc từ chối cấu hình phí kèm lý do | Có |\n| **Billing & Settlement Engine** | Hệ thống nội bộ | Đọc cấu hình phí ở trạng thái `ACTIVE` hợp lệ tại thời điểm giao dịch phát sinh để tính chính xác chi phí phải trả đối tác | Có (Tích hợp) |\n| **Scheduler Job (Hệ thống Lập lịch)** | Hệ thống ngầm | Quét tự động định kỳ các cấu hình `READY` khi chạm mốc `Thời gian áp dụng phí` để chuyển sang `ACTIVE` (Auto Golive) | Có (Tự động) |\n| **Kiểm toán viên / Đối soát viên** | Người dùng nội bộ | Tra cứu lịch sử thay đổi (Audit Trail) để đối soát số liệu và giải trình kiểm toán | Có |\n\n---\n\n### 3. Functional Requirements (FR)\n\n| ID | Title | Description | Priority | Verify by | Source |\n|---|---|---|---|---|---|\n| **FR-partner-fee-management-001** | Danh sách cấu hình phí trả đối tác | Hệ thống phải hiển thị danh sách cấu hình phí dạng bảng gồm 10 cột chuẩn: STT, Mã cấu hình, Tên cấu hình, Loại phí, Đối tác, Kỳ trả phí, Ngày áp dụng, Trạng thái cấu hình (badge màu trực quan), Thao tác (menu 3 chấm). Hỗ trợ 3 tabs trạng thái: *Tất cả*, *Đang hoạt động*, *Chờ phê duyệt*. Phân trang mặc định 10 bản ghi/trang. | P0 | Test | Brainstorm Mục 4 |\n| **FR-partner-fee-management-002** | Bộ lọc tra cứu nâng cao | Hệ thống phải cung cấp thanh bộ lọc gồm 8 tiêu chí: Nguồn dữ liệu, Đối tác/Ngân hàng hưởng phí, Cổng TGTT, Loại phí, Phương thức thanh toán, Kỳ trả phí, Khoảng thời gian áp dụng phí (Trường đơn tích hợp Từ ngày - Đến ngày kèm icon chọn lịch và giờ), Đồng tiền (VND). Cụm nút *[Xóa bộ lọc]* và *[🔍 Tìm kiếm]* nằm riêng biệt ở hàng 4 căn phải. | P0 | Test | Brainstorm Mục 4 |\n| **FR-partner-fee-management-003** | Thêm mới Phí duy trì dịch vụ | Hệ thống phải hỗ trợ Maker tạo mới cấu hình Phí duy trì sử dụng dịch vụ với 2 biến thể:<br>1. *Áp dụng toàn bộ MID*: Thu phí cố định chung cho toàn bộ MID đối tác cung cấp.<br>2. *Không áp dụng (Áp dụng riêng từng MID)*: Cho phép chọn danh sách MID (`MID 1, MID 2, MID 3`) và thiết lập mức p ác biểu phí thu theo tỷ lệ %, nếu có thiết lập Mức phí tối thiểu và Mức phí tối đa thì giá trị phải thỏa mãn: $$0 \\le \\text{Mức phí tối thiểu} \\le \\text{Mức phí tối đa}$$. Không được để Mức phí tối thiểu lớn hơn Mức phí tối đa. | Khi nhập dữ liệu hoặc bấm nút [Tạo mới +] / [Lưu cập nhật] | FR-partner-fee-management-005, 008 | Quy chuẩn tính cước ngân hàng |\n| **BR-partner-fee-management-004** | **Công thức tính thử phí và xử lý trần/sàn**: Số tiền phí thực tế phải trả ($f$) cho một giao dịch có giá trị $V$ được tính theo công thức:<br>$$f_{\\text{raw}} = \\min\\left(\\max(V \\times \\text{Mức phí tỷ lệ}, \\text{Mức phí tối thiểu}), \\text{Mức phí tối đa}\\right)$$<br>$$f = \\text{round}\\left(f_{\\text{raw}} \\times (1 + \\text{Thuế VAT})\\right)$$ | Khi bấm nút [Tính thử] trong Popup Simulator | FR-partner-fee-management-008 | Quy tắc đối soát đối tác EPAY |\n| **BR-partner-fee-management-005** | **Quy tắc Auto Golive của Scheduler Job**: Scheduler Job quét định kỳ. Khi phát hiện cấu hình có trạng thái `READY` và `Thời gian áp dụng phí` $\\le$ `Thời điểm hiện tại`, hệ thống tự động: (1) Chuyển cấu hình `READY` thành `ACTIVE`; (2) Tìm cấu hình cùng đối tác/PTTT/MCC đang `ACTIVE` trước đó để chuyển sang `INACTIVE`. | Khi Job Scheduler quét thời gian định kỳ (1 phút/lần) | FR-partner-fee-management-013 | Quy trình vận hành hệ thống |\n| **BR-partner-fee-management-006** | **Quy tắc Cập nhật bản ghi đang Active**: Khi Maker cập nhật một cấu hình đang ở trạng thái `ACTIVE`, bản ghi hiện tại vẫn duy trì trạng thái `ACTIVE` phục vụ tính cước cho đến khi bản ghi chỉnh sửa được Checker phê duyệt chính thức. | Khi Maker bấm [Lưu cập nhật] từ màn hình Chỉnh sửa | FR-partner-fee-management-009, 012 | BRD Mục 4 & States doc |\n| **BR-partner-fee-management-007** | **Quy tắc Bảo toàn dữ liệu lịch sử (Cấm xóa bản ghi có hiệu lực)**: Chỉ cho phép xóa vĩnh viễn (`DELETED`) các bản ghi ở trạng thái `DRAFT` hoặc `NEW`. Các bản ghi ở trạng thái `PENDING`, `READY`, `ACTIVE`, `INAC tại màn hình Quản lý cấu hình phí trên EPAY Portal.\n**Related UC**: [uc-process-fee-profile](#uc-uc-process-fee-profile)\n**Related FR**: FR-partner-fee-management-003, FR-partner-fee-management-004, FR-partner-fee-management-005, FR-partner-fee-management-006, FR-partner-fee-management-008\n**Related E**: E-partner-fee-management-001, E-partner-fee-management-002, E-partner-fee-management-003, E-partner-fee-management-004\n\n```mermaid\nsequenceDiagram\n    actor Maker as Chuyên viên Vận hành (Maker)\n    participant UI as EPAY Portal UI\n    participant Sim as Fee Simulator Modal\n    participant API as Fee Config Service\n    participant DB as Database (fee_configs)\n    participant Noti as Notification Service\n    actor Checker as Cán bộ Phê duyệt (Checker)\n\n    Maker->>UI: Truy cập menu Quản lý cấu hình phí > [+ Thêm mới]\n    UI-->>Maker: Hiển thị form Thêm mới gồm 4 tab (Duy trì, Xử lý, Thanh toán, DVGT)\n\n    Maker->>UI: Chọn Tab phí, nhập Thông tin chung (Đối tác, Kỳ trả phí, Ngày áp dụng)\n    Maker->>UI: Chọn danh mục mã ngành MCC qua Dual-Listbox\n    Maker->>UI: Cấu hình mức phí (Tỷ lệ %, Min, Max hoặc Bậc thang)\n\n    opt Kiểm thử số liệu tính phí\n        Maker->>UI: Bấm nút [Tính thử 🧮]\n        UI->>Sim: Khởi chạy Popup Tính thử phí\n        Maker->>Sim: Nhập Giá trị GD và SLGD mô phỏng\n        Sim->>Sim: Tính toán theo công thức f = (% * Giá trị GD) * VAT, chặn Min/Max\n        Sim-->>Maker: Hiển thị kết quả Phí thực tế và giải thích công thức\n        Maker->>Sim: Bấm [Đóng popup]\n    end\n\n    alt Nhánh 1: Maker bấm [Lưu nháp]\n        Maker->>UI: Bấm [Lưu nháp]\n        UI->>API: POST /api/v1/fee-configs/draft\n        API->>DB: INSERT INTO fee_configs (status='DRAFT', ycpd=NULL)\n        DB-->>API: Lưu thành công (ID: CHP-2026-xxx)\n        API-->>UI: Response HTTP 201 Created\n        UI-->>Maker: Toast thông báo: \"Lưu nháp cấu hình phí thành công\"\n    else Nhánh 2: Maker bấm [Tạo mới +]\n        Maker->>UI: Bấm [Tạo mới +]\n        UI->>UI: Validate bắt buộc các trường (*) và ràng buộc Min <= Max\n        alt Có lỗi validate (E-CHP-001 đến E-CHP-004)\n            UI-->>Maker: Highlight đỏ trường lỗi & hiển thị thông báo lỗi\n        else Dữ liệu hợp lệ\n            UI->>API: POST /api/v1/fee-configs\n            API->>DB: INSERT INTO fee_configs (status='NEW', ycpd=NULL)\n            DB-->>API: Lưu thành công\n            API-->>UI: Response HTTP 201 Created\n            UI-->>Maker: Toast thông báo: \"Tạo mới cấu hình phí thành công ở trạng thái NEW\"\n        end\n    end\n\n    opt Maker gửi yêu cầu phê duyệt\n        Maker->>UI: Chọn bản ghi NEW > Bấm [📤 Gửi yêu cầu phê duyệt]\n        UI->>API: POST /api/v1/fee-configs/{id}/submit-approval\n        API->>DB: UPDATE fee_configs SET ycpd='PENDING' WHERE id={id}\n        DB-->>API: Cập nhật thành công\n        API->>Noti: Gửi thông báo có YCPD mới đến nhóm Checker\n        Noti-->>Checker: Email / Notification chuông trên Portal\n        API-->>UI: Response HTTP 200 OK\n        UI-->>Maker: Toast thông báo: \"Đã gửi yêu cầu phê duyệt thành công\"\n    end\n```\n\n#### Flow: Checker Thẩm định & Xử lý Yêu cầu Phê duyệt\n**Trigger**: Checker mở tab \"Chờ phê duyệt\" hoặc bấm vào thông báo YCPD trên Portal.\n**Related UC**: [uc-process-fee-profile](#uc-uc-process-fee-profile)\n**Related FR**: FR-partner-fee-management-012\n**Related E**: E-partner-fee-management-005, E-partner-fee-management-006\n\n```mermaid\nsequenceDiagram\n    actor Checker as Cán bộ Phê duyệt (Checker)\n    participant UI as EPAY Portal UI\n    participant API as Fee Config Service\n    participant DB as Database (fee_configs)\n    participant Audit as Audit Trail Service\n    participant Noti as Notification Service\n    actor Maker as Chuyên viên Vận hành (Maker)\n\n    Checker->>UI: Mở tab \"Chờ phê duyệt\" > Chọn mã cấu hình phí cần duyệt\n    UI->>API: GET /api/v1/fee-configs/{id}/approval-detail\n    API->>DB: Truy vấn thông tin cấu hình & lịch sử so sánh CŨ - MỚI\n    DB-->>API: Trả về dataset chi tiết\n    API-->>UI: Render màn hình Chi tiết Checker (Panel YCPD + Nút [✅ Phê duyệt] / [❌ Từ chối])\n\n    Checker->>UI: Thẩm định đối tác, dịch vụ, MCC, mức phí và ngày áp dụng\n\n    alt Nhánh 1: Checker chấp thuận [✅ Phê duyệt]\n        Checker->>UI: Bấm [✅ Phê duyệt]\n        UI->>UI: Hiển thị popup xác nhận phê duyệt\n        Checker->>UI: Xác nhận Đồng ý\n        UI->>API: POST /api/v1/fee-configs/{id}/approve\n        API->>API: Kiểm tra Thời gian áp dụng phí so với thời điểm hiện tại (NOW)\n        alt Ngày áp dụng phí > NOW (Áp dụng trong tương lai)\n            API->>DB: UPDATE fee_configs SET status='READY', ycpd='APPROVAL' WHERE id={id}\n            API->>Audit: Ghi log: \"Checker duyệt cấu hình; chuyển trạng thái READY\"\n        else Ngày áp dụng phí <= NOW (Áp dụng ngay)\n            API->>DB: UPDATE fee_configs SET status='ACTIVE', ycpd='APPROVAL' WHERE id={id}\n            API->>Audit: Ghi log: \"Checker duyệt cấu hình; chuyển trạng thái ACTIVE\"\n        end\n        DB-->>API: Ghi nhận thành công\n        API->>Noti: Bắn thông báo phê duyệt thành công tới Maker\n        Noti-->>Maker: Nhận thông báo cấu hình đã được duyệt\n        API-->>UI: Response HTTP 200 OK\n        UI-->>Checker: Toast thông báo: \"Phê duyệt cấu hình phí thành công\"\n    else Nhánh 2: Checker bác bỏ [❌ Từ chối]\n        Checker->>UI: Bấm [❌ Từ chối]\n        UI-->>Checker: Bật popup yêu cầu nhập Lý do từ chối (bắt buộc)\n        Checker->>UI: Nhập lý do từ chối (vd: \"Tỷ lệ phí sai lệch so với Hợp đồng đính kèm\")\n        UI->>API: POST /api/v1/fee-configs/{id}/reject (kèm reject_reason)\n        API->>DB: UPDATE fee_configs SET status='NEW', ycpd='REJECTED', reject_reason={reason}\n        API->>Audit: Ghi log: \"Checker từ chối duyệt cấu hình; Lý do: {reason}\"\n        DB-->>API: Ghi nhận thành công\n        API->>Noti: Gửi thông báo kèm lý do từ chối về hòm thư Maker\n        Noti-->>Maker: Nhận thông báo bị từ chối kèm lý do để chỉnh sửa lại\n        API-->>UI: Response HTTP 200 OK\n        UI-->>Checker: Toast thông báo: \"Đã từ chối yêu cầu phê duyệt cấu hình\"\n    end\n```\n\n#### Flow: Scheduler Job Tự động Kích hoạt Cấu hình & Vận hành Core Billing\n**Trigger**: Job lập lịch chạy định kỳ lúc 00:00:00 hằng ngày hoặc Maker gửi duyệt Tạm dừng/Kích hoạt lại.\n**Related UC**: [uc-auto-golive](#uc-uc-auto-golive), [uc-process-fee-profile](#uc-uc-process-fee-profile)\n**Related FR**: FR-partner-fee-management-013, FR-partner-fee-management-009, FR-partner-fee-management-010\n**Related E**: E-partner-fee-management-007\n\n```mermaid\nsequenceDiagram\n    participant Job as Scheduler Job (00:00:00)\n    participant DB as Database (fee_configs)\n    participant Core as Core Billing & Settlement Engine\n    participant Audit as Audit Trail Service\n    actor Maker as Chuyên viên Vận hành (Maker)\n    participant UI as EPAY Portal UI\n    actor Checker as Cán bộ Phê duyệt (Checker)\n\n    Note over Job,DB: Giai đoạn 1: Auto-Golive tự động kích hoạt biểu phí đến hạn\n    Job->>DB: SELECT * FROM fee_configs WHERE status='READY' AND apply_date <= NOW()\n    DB-->>Job: Danh sách các bản ghi thỏa mãn điều kiện\n    loop Từng bản ghi cấu hình\n        Job->>DB: UPDATE fee_configs SET status='ACTIVE', ycpd=NULL WHERE id={id}\n        Job->>Audit: Ghi nhận log: \"Job Auto-golive tự động kích hoạt cấu hình {code}\"\n    end\n    Job->>Core: Notify Event: FEE_CONFIG_UPDATED (Reload cache biểu phí)\n    Core->>DB: SELECT * FROM fee_configs WHERE status='ACTIVE'\n    DB-->>Core: Nạp toàn bộ biểu phí ACTIVE vào memory cache\n    Note over Core: Các giao dịch phát sinh từ thời điểm này được tính phí theo cấu hình mới\n\n    Note over Maker,Checker: Giai đoạn 2: Quản trị Tạm dừng / Kích hoạt lại cấu hình\n    alt Maker gửi duyệt Tạm dừng cấu hình đang ACTIVE\n        Maker->>UI: Bấm [🔒 Tạm dừng] > Nhập lý do tạm dừng > Bấm gửi duyệt\n        UI->>DB: UPDATE fee_configs SET ycpd='PENDING' (Status vẫn giữ 'ACTIVE')\n        Note over Core: Cấu hình cũ vẫn tính cước bình thường trong lúc chờ duyệt\n        Checker->>UI: Xem xét YCPD tạm dừng > Bấm [✅ Duyệt tạm dừng]\n        UI->>DB: UPDATE fee_configs SET status='INACTIVE', ycpd='APPROVAL'\n        UI->>Core: Gửi tín hiệu loại bỏ biểu phí khỏi cache\n        Note over Core: Hệ thống ngừng tính phí theo biểu phí này\n    else Maker gửi duyệt Mở kích hoạt lại cấu hình INACTIVE\n        Maker->>UI: Bấm [🔓 Kích hoạt lại] > Bấm gửi duyệt\n        UI->>DB: UPDATE fee_configs SET ycpd='PENDING'\n        Checker->>UI: Xem xét > Bấm [✅ Duyệt kích hoạt]\n        UI->>DB: UPDATE fee_configs SET status='ACTIVE', ycpd='APPROVAL'\n        UI->>Core: Gửi tín hiệu nạp lại biểu phí vào cache Core Engine\n    end\n```\n\n### 10. Screens Summary (Dẫn chiếu 28 Màn hình UI trên Figma Canvas)\n\nToàn bộ 28 màn hình giao diện đã được vẽ hoàn chỉnh tại file **`ForWork`**, page **`CHP Đối tác`** với các phân khu quy hoạch rõ ràng:\n\n#### Khu vực 1: Màn hình Danh sách (Toạ độ $y = 0$)\n- `4020:50223`: Danh sách / Tab Tất cả / 1920 (Bảng dữ liệu 10 cột, bỏ cột Trạng thái YCPD, bộ lọc chuẩn từ ngày - đến ngày).\n- `4020:51051`: Danh sách / Tab Đang hoạt động / 1920.\n- `4020:51879`: Danh sách / Tab Chờ phê duyệt / 1920.\n\n#### Khu vực 2: Màn hình Thêm mới 4 loại phí & Popup tính thử (Toạ độ $y = 1240 \\dots 4800$)\n- **Hàng 2A ($y = 1320$) — Phí Duy trì & Phí Xử lý giao dịch**:\n  - `4022:53508`: Thêm mới - Phí duy trì sử dụng dịch vụ | Áp dụng toàn bộ MID.\n  - `4022:54185`: Thêm mới - Phí duy trì sử dụng dịch vụ | Áp dụng từng MID đối tác cung cấp.\n  - `4022:54899`: Thêm mới - Phí xử lý giao dịch | Áp dụng chung (1 bậc phí, Dual-listbox MCC).\n  - `4022:55659`: Thêm mới - Phí xử lý giao dịch | Không áp dụng (Tách riêng từng loại GD: Thanh toán, Hoàn trả).\n- **Hàng 2B ($y = 2950$) — Phí Thanh toán, Phí Quản lý DVGT & Cụm Popup tính thử**:\n  - `4022:56456`: Thêm mới - Phí thanh toán | 1 bậc phí (Có nút [Tính thử 🧮]).\n  - `4022:57209`: Thêm mới - Phí hải đồng bộ trực tiếp từ Master Data của Portal. | Đội ngũ Kiến trúc Hệ thống Core |\n\n#### Dependencies (Phụ thuộc vào các bên khác)\n| Thành phần phụ thuộc | Đơn vị chủ quản | Ảnh hưởng nếu chưa sẵn sàng |\n|---|---|---|\n| Master Data API (Đối tác, Ngân hàng, Kênh thanh toán, Mã ngành MCC) | Core Platform Team | Maker không thể tải được danh sách lựa chọn trong các dropdown và dual-listbox |\n| Notification Service (Email, Chuông thông báo trên Portal) | Infrastructure Team | Checker không nhận được thông báo khi có yêu cầu phê duyệt mới cần xử lý |\n| Billing & Settlement Engine (Động cơ tính phí) | Billing Team | Bản ghi `ACTIVE` không được đọc vào hệ thống tính cước thực tế |\n\n#### Assumptions (Giả định nghiệp vụ)\n| Giả định | Hệ quả nếu giả định bị sai |\n|---|---|\n| Mỗi đối tác trong một khoảng thời gian nhất định chỉ có duy nhất 1 cấu hình phí có hiệu lực (`ACTIVE`) cho cùng một bộ tham số (PTTT, Loại GD, Cổng TGTT). | Hệ thống phát sinh lỗi xung đột tính cước kép (Double Charging) cho đối tác; cần bổ sung cơ chế giải quyết xung đột mức độ ưu tiên. |\n| Thời gian hệ thống của Server Portal và Scheduler Job đồng bộ qua giao thức NTP chuẩn xác tuyệt đối đến từng giây. | Scheduler Job có thể kích hoạt sớm hoặc muộn hơn so với thời điểm hợp đồng đối tác có hiệu lực. |\n\n\n## <a id=\"sec-erd\"></a>4. ERD\n\n> Scope: Phân hệ Quản lý Cấu hình Phí Trả Đối tác (partner-fee-management) trên EPAY Portal 2.0.\n\n### 1. Diagram (Mermaid ERD)\n\n```mermaid\nerDiagram\n    PARTNER ||--o{ PARTNER_FEE_CONFIG : \"has configs\"\n    PARTNER_FEE_CONFIG ||--o{ FEE_TIER_DETAIL : \"has tiers\"\n    PARTNER_FEE_CONFIG ||--o{ FEE_SERVICE_DETAIL : \"has service items\"\n    PARTNER_FEE_CONFIG ||--o{ FEE_AUDIT_LOG : \"tracks history\"\n    PARTNER_FEE_CONFIG }o--o{ MCC_CATEGORY : \"applies to\"\n\n    PARTNER {\n        string partner_id PK \"Mã đối tác (VCB, MB, KBANK, CYBERSOURCE...)\"\n        string partner_name \"Tên đối tác / Ngân hàng\"\n        string partner_type \"Loại đối tác (BANK, GATEWAY, AGGREGATOR)\"\n        string status \"Trạng thái hợp tác (ACTIVE, INACTIVE)\"\n    }\n\n    PARTNER_FEE_CONFIG {\n        uuid id PK \"Khóa chính bản ghi\"\n        string fee_code UK \"Mã cấu hình phí (vd: SM_PN_DC_001)\"\n        string fee_name \"Tên cấu hình phí\"\n        string fee_type \"Loại phí: MAINTENANCE, TRANSACTION, PAYMENT, ADDED_SERVICE\"\n        string data_source \"Nguồn dữ liệu cấu hình (CTT, QRGW)\"\n        string partner_id FK \"Mã đối tác thụ hưởng\"\n        string cycle_type \"Kỳ trả phí (MONTHLY, QUARTERLY, YEARLY)\"\n        string payment_method \"Phương thức thanh toán (INTERNATIONAL_CARD, DOMESTIC_CARD...)\"\n        string payment_gateway \"Cổng trung gian thanh toán (NAPAS, CYBS, MB, BIDV...)\"\n        string issuing_bank_type \"Loại ngân hàng phát hành (DOMESTIC, INTERNATIONAL)\"\n        timestamp apply_from \"Thời gian bắt đầu áp dụng phí\"\n        timestamp apply_to \"Thời gian kết thúc áp dụng phí (nullable)\"\n        boolean is_general_apply \"Cờ áp dụng chung (TRUE = Áp dụng chung, FALSE = Tách riêng)\"\n        string currency \"Đơn vị tiền tệ (VND)\"\n        decimal vat_rate \"Thuế VAT (8.00%, 10.00%)\"\n        string description \"Mô tả cấu hình\"\n        string status \"Trạng thái CHP (DRAFT, NEW, PENDING, READY, ACTIVE, INACTIVE, DELETED)\"\n        string ycpd_status \"Trạng thái YCPD (PENDING, APPROVED, REJECTED, NULL)\"\n        string reject_reason \"Lý do từ chối phê duyệt (nếu có)\"\n        string created_by \"Tài khoản Maker tạo\"\n        timestamp created_at \"Thời điểm tạo\"\n        string updated_by \"Tài khoản Maker/Checker cập nhật\"\n        timestamp updated_at \"Thời điểm cập nhật\"\n        string approved_by \"Tài khoản Checker phê duyệt\"\n        timestamp approved_at \"Thời điểm phê duyệt\"\n    }\n\n    FEE_TIER_DETAIL {\n        uuid id PK \"Khóa chính bậc phí\"\n        uuid fee_config_id FK \"Mã cấu hình phí liên kết\"\n        string tier_type \"Loại bậc: SINGLE_TIER, VOLUME_TIER, AMOUNT_TIER, TOKEN_TIER\"\n        int tier_order \"Thứ tự bậc (1, 2, 3...)\"\n        decimal from_val \"Giá trị bắt đầu của bậc (SLGD, GTGD, SL Token)\"\n        decimal to_val \"Giá trị kết thúc của bậc (null nếu không giới hạn trên)\"\n        decimal fee_rate \"Mức phí tỷ lệ % (vd: 0.7500%)\"\n        decimal min_fee \"Mức phí tối thiểu chặn sàn (VND)\"\n        decimal max_fee \"Mức phí tối đa chặn trần (VND)\"\n        decimal fixed_fee \"Mức phí cố định trên mỗi GD hoặc mỗi kỳ (VND)\"\n    }\n\n    FEE_SERVICE_DETAIL {\n        uuid id PK \"Khóa chính chi tiết dịch vụ/đối tượng\"\n        uuid fee_config_id FK \"Mã cấu hình phí liên kết\"\n        string item_type \"Loại đối tượng: MID, TRANSACTION_TYPE, CARD_BRAND, ADDED_SERVICE\"\n        string item_code \"Mã đối tượng (MID_01, PAYMENT, REFUND, VISA, MASTER, TOKEN, RISK, FASTPAY)\"\n        string item_name \"Tên đối tượng hiển thị\"\n        string fee_mode \"Hình thức thu phí (1 bậc phí, Bậc thang...)\"\n        decimal specific_fee \"Mức phí riêng áp dụng cho đối tượng (VND hoặc %)\"\n        decimal min_fee \"Mức phí tối thiểu riêng (VND)\"\n        decimal max_fee \"Mức phí tối đa riêng (VND)\"\n    }\n\n    FEE_AUDIT_LOG {\n        uuid id PK \"Khóa chính dòng log\"\n        uuid fee_config_id FK \"Mã cấu hình phí\"\n        string action_type \"Loại hành động (CREATE, UPDATE, SUBMIT_APPROVAL, APPROVE, REJECT, PAUSE, REACTIVATE)\"\n        string old_status \"Trạng thái trước thay đổi\"\n        string new_status \"Trạng thái sau thay đổi\"\n        string changed_field \"Tên trường dữ liệu thay đổi\"\n        text old_value \"Giá trị cũ\"\n        text new_value \"Giá trị mới\"\n        string user_id \"Tài khoản người thực hiện\"\n        string user_role \"Vai trò (MAKER, CHECKER, SYSTEM_JOB)\"\n        string ip_address \"Địa chỉ IP người thao tác\"\n        timestamp created_at \"Thời điểm ghi log kiểm toán\"\n    }\n\n    MCC_CATEGORY {\n        string mcc_code PK \"Mã ngành (vd: 4784, 5411, 4900, 5732, 5814, 6300)\"\n        string mcc_name \"Tên ngành kinh doanh (vd: Siêu thị, Cửa hàng điện máy, Bảo hiểm...)\"\n        string group_name \"Nhóm ngành (Dịch vụ thiết yếu, Tiêu dùng, Bán lẻ...)\"\n    }\n```\n\n---\n\n### 2. Entity Reference (Từ điển dữ liệu chi tiết)\n\n| Thực thể (Entity) | Mục đích nghiệp vụ | Khóa chính / Khóa ngoại | Các thuộc tính cốt lõi |\n|---|---|---|---|\n| **`PARTNER_FEE_CONFIG`** | Lưu trữ thông tin tổng thể của một cấu hình biểu phí trả cho đối tác; quản trị vòng đời qua 7 trạng thái bản ghi và trạng thái YCPD. | PK: `id`<br>FK: `partner_id` | `fee_code`, `fee_name`, `fee_type`, `partner_id`, `status`, `ycpd_status`, `apply_from`, `apply_to`, `is_general_apply`, `vat_rate`. |\n| **`FEE_TIER_DETAIL`** | Lưu trữ các mức phí chi tiết theo mô hình 1 bậc phí hoặc nhiều bậc phí bậc thang (theo Tổng SLGD, Tổng GTGD hoặc Tổng số lượng Token). | PK: `id`<br>FK: `fee_config_id` | `tier_order`, `from_val`, `to_val`, `fee_rate`, `min_fee`, `max_fee`, `fixed_fee`. |\n| **`FEE_SERVICE_DETAIL`** | Lưu trữ thông số phân rã khi chọn chế độ \"Không áp dụng\" (tách riêng từng MID, từng loại giao dịch Thanh toán/Hoàn trả, từng thương hiệu thẻ Visa/Master/JCB, hoặc từng dịch vụ gia tăng). | PK: `id`<br>FK: `fee_config_id` | `item_type`, `item_code`, `item_name`, `fee_mode`, `specific_fee`, `min_fee`, `max_fee`. |\n| **`FEE_AUDIT_LOG`** | Lưu vết toàn bộ lịch sử biến động dữ liệu và trạng thái cấu hình (bất biến - Immutable), phục vụ kiểm toán nội bộ, đối soát và giải trình thanh tra. | PK: `id`<br>FK: `fee_config_id` | `action_type`, `old_status`, `new_status`, `changed_field`, `old_value`, `new_value`, `user_id`, `created_at`. |\n| **`PARTNER`** | Quản lý danh mục các đối tác thụ hưởng, ngân hàng kết nối cổng thanh toán. | PK: `partner_id` | `partner_name`, `partner_type`, `status`. |\n| **`MCC_CATEGORY`** | Danh mục mã ngành kinh doanh chuẩn quốc tế phục vụ phân loại đơn vị chấp nhận thanh toán khi cấu hình phí xử lý giao dịch. | PK: `mcc_code` | `mcc_name`, `group_name`. |\n\n---\n\n### 3. Notes & Assumptions\n\n1. **Tính bất biến của Audit Log**: Bảng `FEE_AUDIT_LOG` chỉ cho phép thao tác `INSERT`, tuyệt đối cấm mọi thao tác `UPDATE` và `DELETE` ở tầng CSDL để đảm bảo tính pháp lý kiểm toán.\n2. **Khóa logic chống xung đột**: CSDL áp dụng Unique Index có điều kiện trên bộ trường `(partner_id, payment_method, payment_gateway, fee_type)` đối với các bản ghi có trạng thái `ACTIVE` hoặc `READY` trong cùng khoảng thời gian chồng lấn `[apply_from, apply_to]`.\n3. **Lưu trữ số tiền và tỷ lệ**: Mọi trường tiền tệ lưu dưới dạng `DECIMAL(15, 2)` (VND); mọi tỷ lệ phần trăm lưu dưới dạng `DECIMAL(7, 4)` (hỗ trợ độ chính xác đến 4 chữ số sau dấu phẩy).\n\n\n## <a id=\"sec-states\"></a>5. State Diagrams\n\n### State: PartnerFeeConfig\n**Related entity**: PartnerFeeConfig\n**Related UC**: [uc-process-fee-profile](#uc-uc-process-fee-profile), [uc-auto-golive](#uc-uc-auto-golive), [uc-delete-fee](#uc-uc-delete-fee), [uc-view-detail-fee](#uc-uc-view-detail-fee)\n**Related BR**: BR-partner-fee-management-001, BR-partner-fee-management-002, BR-partner-fee-management-003\n\n```mermaid\nstateDiagram-v2\n    [*] --> Draft : 1. Lưu bản nháp (Maker)\n    [*] --> New : 1b. Tạo mới trực tiếp (Maker)\n\n    Draft --> New : 3. Hoàn thiện thông tin & Tạo mới (Maker)\n    Draft --> Deleted : 4a. Xóa bản nháp (Maker)\n\n    New --> New : 2. Cập nhật thông tin (Maker)\n    New --> Pending : 5. Gửi phê duyệt (Maker)\n    New --> Deleted : 4b. Xóa bản ghi (Maker)\n\n    Pending --> New : 6. Từ chối duyệt (Checker - kèm lý do)\n    Pending --> Ready : 7A. Phê duyệt (Checker - Ngày áp dụng > Hiện tại)\n    Pending --> Active : 7B. Phê duyệt (Checker - Ngày áp dụng <= Hiện tại)\n    Pending --> Inactive : 7C. Phê duyệt Tạm dừng (Checker)\n    Pending --> Active : 7D. Phê duyệt Cập nhật / Kích hoạt lại (Checker)\n\n    Ready --> New : 8A. Cập nhật thông tin (Maker - Reset về New)\n    Ready --> Active : 8B. Auto golive (Scheduler Job quét đúng thời điểm)\n\n    Active --> Pending : 10. Gửi duyệt Tạm dừng (Maker)\n    Active --> Pending : 11. Gửi duyệt Cập nhật thông tin (Maker)\n\n    Inactive --> Inactive : 12. Cập nhật thông tin (Maker)\n    Inactive --> Pending : 13. Gửi duyệt mở Kích hoạt (Maker)\n\n    Deleted --> [*]\n```\n\n#### Invalid transitions\n\n| Từ trạng thái | Đến trạng thái | Lý do cấm (Why not) |\n|---|---|---|\n| `Deleted` | Bất kỳ | Bản ghi đã xóa vĩnh viễn khỏi chu trình vận hành, không được phép phục hồi |\n| `Active` | `Deleted` | Cấu hình đang hoạt động tính cước không được phép xóa; bắt buộc phải qua luồng Tạm dừng (`Inactive`) |\n| `Ready` | `Deleted` | Cấu hình đã được Checker phê duyệt sẵn sàng golive không được xóa trực tiếp; phải cập nhật để reset về `New` rồi mới xóa |\n| `Inactive` | `Deleted` | Cấu hình đã từng phát sinh hiệu lực tính cước phải được bảo toàn trong cơ sở dữ liệu để phục vụ đối soát và kiểm toán lịch sử (Audit Log) |\n| `Pending` | `Deleted` | Bản ghi đang trong hàng đợi phê duyệt của Checker bị khóa thao tác xóa để đảm bảo tính toàn vẹn của Yêu cầu phê duyệt (YCPD) |\n| `Active` | `Ready` | Cấu hình đang có hiệu lực không thể quay ngược về trạng thái chờ kích hoạt trong tương lai |\n| `Draft` | `Pending` | Bản nháp chưa được xác thực đầy đủ các trường thông tin bắt buộc (*); phải bấm [Tạo mới +] để chuyển sang `New` trước khi gửi duyệt |\n| `Draft` | `Active` / `Ready` | Bắt buộc phải tuân thủ nguyên tắc kiểm soát 4 mắt (Maker – Checker), không thể nhảy cóc từ nháp lên trạng thái hiệu lực |\n\n\n## <a id=\"sec-functions\"></a>6. Functions\n\n### Use Cases Index\n\n#### 1. Danh sách Use Cases (Traceability Matrix)\n\n> Bảng ma trận truy vết per-feature kết nối đa chiều giữa Use Case, Yêu cầu chức năng (FR), Màn hình giao diện (Screens trên Figma canvas `CHP Đối tác`), Mã lỗi (Error Matrix) và Mức độ ưu tiên.\n\n| # | Tên Use Case | Mã Slug | Cấp độ | Trạng thái | Actor chính | Đáp ứng FR | Màn hình liên kết (Figma Frame ID) | Mã lỗi li * | **R** | **R** | **R** | **R** | **R** |\n| **[uc-delete-fee](#uc-uc-delete-fee)** | **D** (Logic: `DELETED`) | **D** | **D** | **C** (Log xóa) | |\n| **[uc-process-fee-profile](#uc-uc-process-fee-profile)** | **C, R, U** | **C, R, U** | **C, R, U** | **C** (Ghi vết) | **R** |\n| **[uc-auto-golive](#uc-uc-auto-golive)** | **R, U** (`READY` $\\to$ `ACTIVE`) | | | **C** (Log hệ thống)| |\n\n---\n\n#### 3. Actors Reference\n\n| Actor | Loại | Mô tả vai trò nghiệp vụ | Nguồn thẩm quyền |\n|---|---|---|---|\n| **Maker** | Primary Actor (Người dùng nội bộ) | Chuyên viên Vận hành / Tính cước EPAY. Phụ trách tra cứu, thêm mới, sửa đổi, xóa nháp và gửi phê duyệt hồ sơ biểu phí. | Phân quyền vai trò Maker trên EPAY Portal |\n| **Checker** | Primary Actor (Người dùng nội bộ) | Trưởng phòng / Cán bộ Phê duyệt EPAY. Phụ trách thẩm định hồ sơ so sánh CŨ - MỚI, ra quyết định Phê duyệt hoặc Từ chối hồ sơ. | Phân quyền vai trò Checker trên EPAY Portal |\n| **Scheduler Job** | System Actor (Hệ thống ngầm) | Tiến trình tự động hóa chạy định kỳ trên máy chủ Portal, phụ trách quét thời gian hiệu lực và kích hoạt biểu phí tự động (Auto Golive). | Cron Job / Scheduler Service |\n| **Billing & Settlement Engine** | Secondary Actor (Hệ thống nội bộ) | Động cơ tính cước và đối soát doanh thu chi phí, nhận dữ liệu cấu hình `ACTIVE` để cấn trừ phí giao dịch đối tác. | Module Billing Backend |\n\n---\n\n#### 4. Use Case Relationships\n\n| Mối quan hệ | Từ Use Case (From) | Đến Use Case (To) | Giải thích lý do nghiệp vụ |\n|---|---|---|---|\n| **extend** | `uc-export-fee` | `uc-search-list-fee` | Người dùng mở rộng thao tác xuất tệp Excel trực tiếp từ kết quả danh sách đang tìm kiếm. |\n| **extend** | `uc-delete-fee` | `uc-search-list-fee` | Người dùng chọn xóa bản ghi `DRAFT` hoặc `NEW` từ menu thao tác trên từng dòng danh sách. |\n| **extend** | `uc-delete-fee` | `uc-view-detail-fee` | Người dùng thực hiện xóa bản ghi từ màn hình Xem chi tiết. |\n| **include** | `uc-process-fee-profile` | `uc-view-detail-fee` | Luồng thẩm định của Checker và chỉnh sửa của Maker luôn cần nạp thông tin chi tiết cấu hình hiện tại làm dữ liệu nền. |\n| **trigger** | `uc-process-fee-profile` | `uc-auto-golive` | Khi Checker duyệt một cấu hình có ngày áp dụng trong tương lai (`READY`), bản ghi trở thành đối tượng theo dõi của Scheduler Job. |\n\n---\n\n#### 5. Nguồn dữ liệu tham chiếu\n- **Core Spec SRS**: [`docs/partner-fee-management/srs/partner-fee-management-spec.md`](#sec-spec)\n- **Data ERD**: [`docs/partner-fee-management/srs/partner-fee-management-erd.md`](#sec-erd)\n- **Sơ đồ luồng**: [`docs/partner-fee-management/srs/partner-fee-management-flows.md`](#sec-flows)\n- **Sơ đồ trạng thái**: [`docs/partner-fee-management/srs/partner-fee-management-states.md`](#sec-states)\n\n\n---\n\n### <a id=\"uc-uc-auto-golive\"></a>2.7 BF25-UC06: Job tự động kích hoạt cấu hình (Auto Golive)\n\n#### 2.7.1 Use case\n\n| Mục | Nội dung đặc tả chi tiết |\n|---|---|\n| **Use Case** | **Tự động kích hoạt cấu hình phí đến ngày hiệu lực (Auto Golive)** |\n| **ID** | **BF25 - UC06** |\n| **Description** | Tác vụ nền (Background Cron Job) quét định kỳ vào 00:00:00 hàng ngày, tự động chuyển trạng thái các bản ghi CHP từ `READY` sang `ACTIVE` khi ngày áp dụng trùng hoặc trước ngày hiện tại. |\n| **Actor** | Hệ thống (EPAY Scheduler / Background Job Runner) |\n| **Trigger** | Cron expression kích hoạt định kỳ lúc **00:00:00** hàng ngày (hoặc trigger thủ công từ Super Admin qua API nội bộ). |\n| **Pre-Condition** | Bản ghi CHP đang ở trạng thái `READY` (đã được Checker phê duyệt trước đó và ngày áp dụng > ngày duyệt). |\n| **Post-Condition** | Bản ghi CHP chuyển trạng thái sang `ACTIVE`, tự động ghi log lịch sử kích hoạt, gửi thông báo hoàn tất tới nhóm quản trị. |\n| **Basic flow** | 1. Scheduler Job khởi chạy lúc 00:00:00.<br>2. Quét toàn bộ CSDL bảng `fee_profile` tìm các bản ghi `status = 'READY'` và `apply_start_date <= CURRENT_DATE`.<br>3. Kiểm tra xem có bản ghi cùng loại nào đang `ACTIVE` không để xử lý chuyển sang `INACTIVE` (nếu có cấu hình thay thế).<br>4. Cập nhật `status = 'ACTIVE'`, ghi nhận `updated_by = 'SYSTEM'`, `updated_at = NOW()`.<br>5. Insert bản ghi Audit Log: *“Hệ thống tự động kích hoạt CHP Trả đối tác [Mã CHP] sang ACTIVE ngày [Datetime]”*.<br>6. Bắn thông báo Telegram/Email cho Maker & Checker thông báo cấu hình đã chính thức có hiệu lực. |\n| **Alternative flow** | - **A1**: Không có bản ghi nào đến ngày hiệu lực $\\rightarrow$ Job kết thúc và ghi log hệ thống: *“Quét hoàn tất: 0 bản ghi cần kích hoạt”*. |\n| **Exception flow** | - **E1 (Lỗi Transaction)**: Lỗi CSDL khi update hàng loạt $\\rightarrow$ Rollback toàn bộ transaction và bắn cảnh báo Critical tới kênh Telegram DevOps.<br>- **E2 (Xung đột biểu phí)**: Phát hiện nhiều hơn 1 cấu hình trùng loại cùng hiệu lực $\\rightarrow$ Đánh dấu bản ghi Warning và dừng kích hoạt bản ghi xung đột để chờ đối soát thủ công. |\n| **Business Rules** | [Yêu cầu nghiệp vụ chung tự động kích hoạt cấu hình phí](#273-yêu-cầu-nghiệp-vụ-chung) |\n| **Non-functional requirement** | Quét và xử lý toàn bộ bản ghi trong vòng dưới 30 giây; Đảm bảo 100% tính nguyên tố (ACID Transaction). |\n\n---\n\n#### 2.7.2 Giao diện / Tiến trình\n\n##### Tiến trình Tác vụ Nền (Background Scheduler Process):\n\n```text\n┌───────────────────────────┐\n│  EPAY SCHEDULER (00:00)   │\n└─────────────┬─────────────┘\n              │ 1. Trigger Cron Job\n              ▼\n┌───────────────────────────┐\n│  Truy vấn bảng CSDL       │\n│  status = 'READY'         │\n│  apply_start_date <= TODAY│\n└─────────────┬─────────────┘\n              │ 2. Tìm thấy danh sách N bản ghi\n              ▼\n┌───────────────────────────┐\n│  Kiểm tra xung đột &      │\n│  Update status = 'ACTIVE' │\n└─────────────┬─────────────┘\n              │ 3. Ghi vết Audit Log & Thông báo\n              ▼\n┌───────────────────────────┐\n│  Telegram Alert & Log OK  │\n└───────────────────────────┘\n```\n\n---\n\n#### 2.7.3 Yêu cầu nghiệp vụ chung\n\n| Mã Quy tắc | Tên Quy tắc | Nội dung đặc tả nghiệp vụ chi tiết |\n|---|---|---|\n| **BF25-UC06-BR01.1** | **Thời điểm kích hoạt chính xác** | Hệ thống thực thi tác vụ quét vào đúng **00:00:00 (GMT+7)** hàng ngày. Toàn bộ các cấu hình có `apply_start_date <= Ngày hiện tại` và trạng thái `READY` sẽ được kích hoạt sang `ACTIVE` ngay đầu ngày để đảm bảo các giao dịch phát sinh trong ngày được áp dụng đúng biểu phí mới. |\n| **BF25-UC06-BR01.2** | **Cơ chế thay thế biểu phí tiền nhiệm** | Trường hợp biểu phí mới kích hoạt thay thế cho một biểu phí cũ đang chạy (`ACTIVE`) cùng phạm vi (cùng đối tác, loại dịch vụ, phương thức thanh toán), hệ thống tự động cập nhật trạng thái biểu phí cũ sang `INACTIVE` với lý do *“Hết hiệu lực do có biểu phí mới [Mã CHP mới] thay thế”*. |\n| **BF25-UC06-BR01.3** | **Tính nguyên tố và nhật ký kiểm toán** | Toàn bộ quá trình quét và chuyển đổi trạng thái của từng bản ghi phải nằm trong một Database Transaction riêng biệt. Nếu có lỗi xảy ra với một bản ghi, hệ thống chỉ rollback bản ghi đó và tiếp tục xử lý các bản ghi còn lại mà không làm gián đoạn toàn bộ tiến trình. |\n\n---\n\n#### 2.7.4 Bảng mã lỗi\n\n| Mã lỗi | Tiêu đề lỗi | Điều kiện kích hoạt | Mức độ | Câu thông báo nguyên văn tiếng Việt & Hướng xử lý |\n|---|---|---|---|---|\n| **E1** | Lỗi Transaction CSDL | Xảy ra lỗi deadlock hoặc timeout kết nối CSDL trong tiến trình cập nhật | Critical | *“Lỗi transaction khi kích hoạt tự động cấu hình phí [Mã CHP]. Tiến trình đã rollback an toàn!”* |\n| **E2** | Xung đột biểu phí đồng thời | Phát hiện 2 biểu phí cùng phạm vi có cùng ngày hiệu lực | Major | *“Xung đột phạm vi áp dụng với cấu hình đang hoạt động. Tạm dừng kích hoạt tự động để kiểm tra đối soát!”* |\n| **E3** | Lỗi kết nối dịch vụ thông báo | Không thể gửi tin nhắn Telegram hoặc Email sau khi kích hoạt | Minor | *“Kích hoạt cấu hình thành công nhưng không thể gửi cảnh báo Telegram. Vui lòng kiểm tra dịch vụ Notify!”* |\n\n\n---\n\n### <a id=\"uc-uc-delete-fee\"></a>2.5 BF25-UC04: Xóa CHP Trả đối tác\n\n#### 2.5.1 Use case\n\n| Mục | Nội dung đặc tả chi tiết |\n|---|---|\n| **Use Case** | **Xóa bản ghi cấu hình phí Trả đối tác** |\n| **ID** | **BF25 - UC04** |\n| **Description** | Cho phép Maker xóa các bản ghi cấu hình phí chưa từng phát sinh hiệu lực vận hành (`DRAFT`, `NEW`, `REJECTED`). Cấm tuyệt đối xóa các bản ghi đã từng có hiệu lực (`ACTIVE`, `READY`, `INACTIVE`) hoặc đang trong hàng đợi duyệt (`PENDING`) nhằm bảo toàn lịch sử kiểm toán. |\n| **Actor** | Maker (Chuyên viên Vận hành / Tính cước EPAY) |\n| **Trigger** | Maker click chọn thao tác **[Xóa]** từ menu 3 chấm trên dòng danh sách hoặc từ nút [Xóa] trên màn hình chi tiết. |\n| **Pre-Condition** | Đăng nhập tài khoản Maker; bản ghi cấu hình ở trạng thái cho phép xóa (`DRAFT`, `NEW`, `REJECTED`). |\n| **Post-Condition** | Bản ghi chuyển sang trạng thái `DELETED` (xóa logic khỏi danh mục vận hành, ghi vết audit log). |\n| **Basic flow** | 1. Maker click chọn [Xóa] tại dòng bản ghi trên bảng danh sách.<br>2. Hệ thống kiểm tra trạng thái của bản ghi.<br>3. Hệ thống hiển thị Modal xác nhận: *“Bạn có chắc chắn muốn xóa bản ghi [Mã phí] không? Thao tác này không thể hoàn tác.”*<br>4. Maker bấm nút **[Xác nhận xóa]**.<br>5. Hệ thống cập nhật `status = DELETED`, hủy liên kết hàng đợi và lưu vết log xóa.<br>6. Hệ thống hiển thị Toast: *“Đã xóa bản ghi thành công!”*, tự động tải lại bảng danh sách. |\n| **Alternative flow** | - **A1**: Maker bấm nút **[Hủy bỏ]** trong Modal xác nhận $\\rightarrow$ Đóng modal, giữ nguyên bản ghi không thay đổi. |\n| **Exception flow** | - **E1 (Cấm xóa bản ghi hiệu lực)**: Người dùng cố tình gọi lệnh xóa bản ghi `ACTIVE`, `READY`, hoặc `INACTIVE` $\\rightarrow$ Hệ thống hiển thị Modal cảnh báo từ chối `E-partner-fee-management-008`: *“Không thể xóa cấu hình phí đã phát sinh hiệu lực vận hành. Bạn chỉ có thể thực hiện Tạm dừng cấu hình này!”*.<br>- **E2 (Bản ghi đang chờ duyệt)**: Người dùng cố xóa bản ghi `PENDING` $\\rightarrow$ Toast cảnh báo `E-partner-fee-management-007`: *“Cấu hình đang trong trạng thái Chờ phê duyệt. Không thể xóa vào thời điểm này!”*. |\n| **Business Rules** | [Yêu cầu nghiệp vụ chung xóa bản ghi CHP Trả đối tác](#253-yêu-cầu-nghiệp-vụ-chung) |\n| **Non-functional requirement** | Thao tác kiểm tra trạng thái và xóa bản ghi phản hồi $< 500$ms. |\n\n---\n\n#### 2.5.2 Giao diện\n\n##### Màn hình Wireframe liên kết:\n* **BF25-UC04-WF01**: Modal Xác nhận trước khi xóa bản ghi (`4020:50006`)\n* **BF25-UC04-WF02**: Modal Cảnh báo cấm xóa bản ghi có hiệu lực\n\n##### Bảng Đặc tả Từ điển Trường Dữ liệu (Screen Data Dictionary):\n\n| Component Name | Data Type | Validation rules (M/O/C) | Editable (Y/N) | Other Validation | Action rules |\n|---|---|:---:|:---:|---|---|\n| **Modal Xác nhận Xóa** | Dialog Container | M | N | Readonly | Modal popup hiển thị câu cảnh báo xác nhận nguy cơ. |\n| **Nút [Hủy bỏ]** | Button | O | Y | Click | Đóng modal popup, không thực hiện bất kỳ thay đổi nào. |\n| **Nút [Xác nhận xóa]** | Button (Danger) | M | Y | Click | Màu đỏ cảnh báo (`#EF4444`). Kích hoạt API xóa logic bản ghi. |\n\n---\n\n#### 2.5.3 Yêu cầu nghiệp vụ chung\n\n| Mã Quy tắc | Tên Quy tắc | Nội dung đặc tả nghiệp vụ chi tiết |\n|---|---|---|\n| **BF25-UC04-BR01.1** | **Quy tắc trạng thái được phép xóa** | Chỉ cho phép xóa bản ghi đối với 3 trạng thái: `DRAFT`, `NEW`, `REJECTED`. Tuyệt đối không xóa vật lý (Hard Delete) khỏi database đối với các bản ghi đã từng phát sinh hiệu lực tính cước (`ACTIVE`, `READY`, `INACTIVE`) nhằm bảo vệ tính toàn vẹn dữ liệu cho công tác thanh kiểm tra tài chính. |\n| **BF25-UC04-BR01.2** | **Cơ chế Soft-Delete & Audit Trail** | Khi thực hiện xóa, hệ thống cập nhật trường `status = 'DELETED'`, `deleted_at = NOW()`, `deleted_by = [Username]`. Bản ghi sẽ bị ẩn khỏi toàn bộ các màn hình vận hành thông thường nhưng vẫn được lưu giữ trong cơ sở dữ liệu để phục vụ truy vấn lịch sử kiểm toán. |\n\n---\n\n#### 2.5.4 Bảng mã lỗi\n\n| Mã lỗi | Tiêu đề lỗi | Điều kiện kích hoạt | Mức độ | Câu thông báo nguyên văn tiếng Việt & Hướng xử lý |\n|---|---|---|---|---|\n| **E-partner-fee-007** | Bản ghi đang chờ duyệt | Maker bấm xóa cấu hình đang có trạng thái `PENDING` | Major | *“Cấu hình đang trong trạng thái Chờ phê duyệt. Không thể xóa vào thời điểm này!”* |\n| **E-partner-fee-008** | Cấm xóa bản ghi hiệu lực | Cố tình xóa bản ghi `ACTIVE`, `READY` hoặc `INACTIVE` | Critical | *“Không thể xóa cấu hình phí đã phát sinh hiệu lực vận hành. Bạn chỉ có thể thực hiện Tạm dừng cấu hình này!”* |\n| **E3** | Không có quyền thao tác | Tài khoản không có vai trò Maker hoặc bị khóa quyền chỉnh sửa | Major | *“Bạn không có thẩm quyền xóa bản ghi cấu hình phí này!”* |\n| **E4** | Lỗi kết nối CSDL | Mất kết nối CSDL khi thực thi câu lệnh Soft-Delete | Major | *“Lỗi kết nối cơ sở dữ liệu khi thực hiện xóa bản ghi. Vui lòng thử lại sau!”* |\n\n\n---\n\n### <a id=\"uc-uc-export-fee\"></a>2.3 BF25-UC02: Xuất tệp dữ liệu CHP Trả đối tác\n\n#### 2.3.1 Use case\n\n| Mục | Nội dung đặc tả chi tiết |\n|---|---|\n| **Use Case** | **Xuất tệp dữ liệu danh sách cấu hình phí Trả đối tác** |\n| **ID** | **BF25 - UC02** |\n| **Description** | Cho phép người dùng xuất dữ liệu danh sách cấu hình phí ra tệp định dạng Excel hoặc PDF phục vụ công tác đối soát cước, lưu trữ hồ sơ và báo cáo tài chính. |\n| **Actor** | User thuộc nhóm quyền tương ứng (Maker, Checker, Đối soát viên, Kế toán viên) |\n| **Trigger** | Người dùng click chọn button **[Xuất tệp ▼]** trên thanh công cụ phía trên bảng danh sách. |\n| **Pre-Condition** | Người dùng đã đăng nhập, có quyền xuất tệp dữ liệu và đã có kết quả tìm kiếm/danh sách trên màn hình. |\n| **Post-Condition** | Hệ thống sinh tệp tải về thành công (định dạng `.xlsx` hoặc `.pdf`) chứa danh sách cấu hình phí theo đúng điều kiện lọc hiện tại. |\n| **Basic flow** | 1. Người dùng chọn các tiêu chí lọc và bấm [Tìm kiếm] để nạp danh sách kết quả (hoặc sử dụng danh sách mặc định).<br>2. Click button **[Xuất tệp ▼]** ở góc trên bên phải bảng danh sách.<br>3. Hệ thống hiển thị dropdown gồm 2 lựa chọn: *Xuất Excel (.xlsx)* và *Xuất PDF (.pdf)*.<br>4. Người dùng click chọn định dạng mong muốn.<br>5. Hệ thống kiểm tra số lượng bản ghi thỏa mãn điều kiện lọc.<br>6. Hệ thống thực hiện kết xuất dữ liệu và kích hoạt trình tải tệp xuống máy tính của người dùng. |\n| **Alternative flow** | - **A1**: Không có bản ghi nào thỏa mãn điều kiện lọc $\\rightarrow$ Hệ thống hiển thị cảnh báo: *“Không có dữ liệu để xuất tệp”*, không thực hiện sinh tệp trống.<br>- **A2**: Số lượng bản ghi vượt quá 50.000 dòng $\\rightarrow$ Hệ thống hiển thị thông báo yêu cầu người dùng thu hẹp khoảng thời gian hoặc xuất dữ liệu qua hàng đợi tác vụ ngầm. |\n| **Exception flow** | - **E1**: Lỗi timeout khi kết xuất tệp (> 30 giây) $\\rightarrow$ Thông báo lỗi hệ thống và gợi ý người dùng thử lại.<br>- **E2**: Mất kết nối mạng internet trong lúc tải file. |\n| **Business Rules** | [Yêu cầu nghiệp vụ chung xuất tệp dữ liệu CHP Trả đối tác](#233-yêu-cầu-nghiệp-vụ-chung) |\n| **Non-functional requirement** | Thời gian xuất file $< 5$ giây với tập dữ liệu dưới 5.000 dòng; $< 15$ giây với tập dữ liệu từ 5.000 đến 50.000 dòng. |\n\n---\n\n#### 2.3.2 Giao diện\n\n##### Màn hình Wireframe liên kết:\n* **BF25-UC02-WF01**: Menu Dropdown Xuất tệp trên thanh công cụ Danh sách (`4020:50223`)\n\n##### Bảng Đặc tả Từ điển Trường Dữ liệu (Screen Data Dictionary):\n\n| Component Name | Data Type | Validation rules (M/O/C) | Editable (Y/N) | Other Validation | Action rules |\n|---|---|:---:|:---:|---|---|\n| **Button [Xuất tệp ▼]** | Button | O | Y | Click | Hiển thị menu dropdown 2 mục chọn định dạng file xuất. |\n| **Option [Xuất Excel (.xlsx)]** | Menu item | O | Y | Click | Kích hoạt tiến trình kết xuất bảng tính Excel với đầy đủ định dạng số, ngày tháng và kẻ bảng chuẩn. |\n| **Option [Xuất PDF (.pdf)]** | Menu item | O | Y | Click | Kích hoạt tiến trình xuất báo cáo tài liệu PDF khổ ngang (A4 Landscape) có header/footer và đánh số trang. |\n| **Toast thông báo tiến trình** | Toast Banner | C | N | Readonly | Hiển thị thông báo *“Đang chuẩn bị tệp dữ liệu, vui lòng đợi...”* kèm spinner loading trong khi hệ thống đang xử lý. |\n\n---\n\n#### 2.3.3 Yêu cầu nghiệp vụ chung\n\n| Mã Quy tắc | Tên Quy tắc | Nội dung đặc tả nghiệp vụ chi tiết |\n|---|---|---|\n| **BF25-UC02-BR01.1** | **Quy tắc đặt tên tệp kết xuất** | Tên tệp được tự động đặt theo quy chuẩn: `EPAY_CHP_TraDoiTac_[TabTrangThai]_[ddMMyyyy_HHmmss].[ext]` (Ví dụ: `EPAY_CHP_TraDoiTac_TatCa_08112026_153000.xlsx`). |\n| **BF25-UC02-BR01.2** | **Quy tắc dữ liệu trong tệp xuất** | Dữ liệu trong tệp xuất ra phải khớp 100% với danh sách kết quả tìm kiếm theo bộ lọc hiện tại trên giao diện, bao gồm cả các dòng ở các trang sau (không chỉ xuất riêng trang hiện tại). Cột Mã cấu hình giữ nguyên định dạng chuỗi văn bản để tránh bị lỗi mất số 0 đầu dòng. |\n| **BF25-UC02-BR01.3** | **Quy tắc ghi nhận nhật ký xuất tệp** | 100% thao tác xuất tệp phải được ghi nhận vào nhật ký hệ thống (`audit_logs`) gồm: User thực hiện, Thời điểm xuất, Bộ tiêu chí lọc đã áp dụng và Số lượng bản ghi kết xuất. |\n\n---\n\n#### 2.3.4 Bảng mã lỗi\n\n| Mã lỗi | Tiêu đề lỗi | Điều kiện kích hoạt | Mức độ | Câu thông báo nguyên văn tiếng Việt & Hướng xử lý |\n|---|---|---|---|---|\n| **E1** | Không có dữ liệu để xuất | Danh sách tìm kiếm rỗng không có bản ghi nào | Minor | *“Không có dữ liệu để xuất tệp. Vui lòng thử lại với điều kiện tìm kiếm khác!”* |\n| **E2** | Vượt quá số lượng bản ghi tối đa | Số lượng bản ghi thỏa mãn điều kiện lọc $> 50.000$ dòng | Major | *“Dữ liệu kết xuất vượt quá giới hạn 50.000 bản ghi. Vui lòng thu hẹp khoảng thời gian tìm kiếm hoặc lọc theo đối tác cụ thể!”* |\n| **E3** | Lỗi timeout khi tạo tệp | Quá trình sinh tệp kéo dài quá 30 giây | Major | *“Hệ thống đang quá tải, không thể tạo tệp vào lúc này. Vui lòng thử lại sau giây lát!”* |\n| **E4** | Mất kết nối internet khi tải tệp | Gián đoạn kết nối mạng khi tải luồng dữ liệu tệp | Major | *“Đường truyền mạng bị gián đoạn trong khi tải tệp. Vui lòng kiểm tra kết nối mạng và bấm Xuất tệp lại!”* |\n\n\n---\n\n### <a id=\"uc-uc-process-fee-profile\"></a>2.6 BF25-UC05: Xử lý thông tin hồ sơ CHP Trả đối tác\n\n#### 2.6.1 Use case\n\n| Mục | Nội dung đặc tả chi tiết |\n|---|---|\n| **Use Case** | **Xử lý thông tin hồ sơ và Phê duyệt Maker – Checker cấu hình phí Trả đối tác** |\n| **ID** | **BF25 - UC05** |\n| **Description** | Quản lý toàn bộ vòng đời tương tác Maker – Checker theo nguyên tắc kiểm soát 4 mắt (Four-Eyes Principle): Maker gửi yêu cầu phê duyệt từ các trạng thái; Checker thẩm định đối chiếu so sánh trực quan CŨ – MỚI và ra quyết định Phê duyệt hoặc Từ chối kèm lý do; Maker rút yêu cầu hoặc điều chuyển người phê duyệt; Maker gửi yêu cầu Tạm dừng (`Active` $\\rightarrow$ `Inactive`) và Mở kích hoạt (`Inactive` $\\rightarrow$ `Active`/`Ready`). |\n| **Actor** | Maker, Checker, Quản lý Maker |\n| **Trigger** | Maker bấm nút gửi phê duyệt / tạm dừng / kích hoạt; hoặc Checker bấm nút phê duyệt / từ chối trên hồ sơ. |\n| **Pre-Condition** | Bản ghi cấu hình phí ở trạng thái hợp lệ tương ứng với từng hành động; người dùng có vai trò và thẩm quyền phê duyệt. |\n| **Post-Condition** | Bản ghi cấu hình phí và hồ sơ YCPD liên kết được chuyển trạng thái chính xác theo đúng ma trận quy tắc nghiệp vụ 2.6.5. |\n| **Basic flow** | **[Luồng A — Maker Gửi yêu cầu phê duyệt]**:<br>1. Maker mở bản ghi ở trạng thái `NEW` (hoặc `ACTIVE`, `INACTIVE`).<br>2. Bấm nút **[Gửi yêu cầu phê duyệt]** (hoặc *Gửi duyệt cập nhật*, *Gửi tạm dừng*, *Gửi mở kích hoạt*).<br>3. Hệ thống sinh mã YCPD `AR_MM_MC_[Timestamp]`, insert 1 bản ghi YCPD tương ứng với trạng thái `Pending`.<br>4. Bản ghi CHP chuyển trạng thái tương ứng (`PENDING`).<br><br>**[Luồng B — Checker Thẩm định & Phê duyệt]**:<br>1. Checker đăng nhập, truy cập tab *Chờ phê duyệt* và mở hồ sơ YCPD cần xử lý.<br>2. Hệ thống hiển thị màn hình Thẩm định đối chiếu CŨ – MỚI (highlight màu cam/xanh các trường có sự thay đổi).<br>3. Checker đối chiếu tham số với hợp đồng thương mại.<br>4. Checker lựa chọn hành động:<br>   - **Trường hợp Đồng ý**: Bấm **[✔ Phê duyệt]** $\\rightarrow$ Hệ thống cập nhật YCPD thành `Approval`; Chuyển trạng thái CHP sang `ACTIVE` (nếu ngày áp dụng $\\le$ hiện tại) hoặc `READY` (nếu ngày áp dụng $>$ hiện tại).<br>   - **Trường hợp Không đồng ý**: Bấm **[✖ Từ chối]** $\\rightarrow$ Hệ thống hiển thị modal bắt buộc Checker nhập lý do từ chối (tối thiểu 10 ký tự) $\\rightarrow$ Cập nhật YCPD thành `Rejected`, trả bản ghi CHP về `NEW` (hoặc `REJECTED`) để Maker xử lý lại. |\n| **Alternative flow** | - **A1 (Rút yêu cầu)**: Khi hồ sơ đang `PENDING` và Checker chưa xử lý, Maker bấm **[Rút yêu cầu]** $\\rightarrow$ Bản ghi quay về `NEW`, YCPD chuyển `Cancelled`.<br>- **A2 (Đổi người duyệt)**: Maker bấm **[Thay đổi người PD]** $\\rightarrow$ Chọn Checker hợp lệ khác $\\rightarrow$ Cập nhật trường Người phê duyệt trong YCPD.<br>- **A3 (Tạm dừng cấu hình)**: Maker gửi yêu cầu tạm dừng từ `ACTIVE` $\\rightarrow$ Checker duyệt $\\rightarrow$ Bản ghi chuyển sang `INACTIVE`.<br>- **A4 (Mở kích hoạt)**: Maker gửi yêu cầu mở kích hoạt từ `INACTIVE` $\\rightarrow$ Checker duyệt $\\rightarrow$ Bản ghi chuyển sang `ACTIVE` (hoặc `READY`). |\n| **Exception flow** | - **E1 (Vi phạm kiểm soát 4 mắt)**: Maker cố tình tự phê duyệt bản ghi do chính mình tạo ra $\\rightarrow$ Hệ thống chặn trực tiếp với mã lỗi `E-partner-fee-management-006`.<br>- **E2 (Thiếu lý do từ chối)**: Checker bấm xác nhận từ chối nhưng bỏ trống lý do hoặc nhập $< 10$ ký tự $\\rightarrow$ Báo lỗi `E-partner-fee-management-005`. |\n| **Business Rules** | [Yêu cầu nghiệp vụ chung xử lý hồ sơ và Phê duyệt Maker - Checker](#263-yêu-cầu-nghiệp-vụ-chung) |\n| **Non-functional requirement** | Thẩm định đối chiếu so sánh CŨ - MỚI phản hồi $< 1.0$ giây; Cập nhật trạng thái phê duyệt $< 1.0$ giây. |\n\n---\n\n#### 2.6.2 Giao diện\n\n##### Màn hình Wireframe liên kết:\n* **BF25-UC05-WF01**: Phê duyệt / Checker — Chờ phê duyệt (`4020:47923`)\n* **BF25-UC05-WF02**: Phê duyệt / Checker — Màn hình Thẩm định so sánh CŨ MỚI (`4020:48856`)\n* **BF25-UC05-WF03**: Modal Xác nhận từ chối phê duyệt (bắt buộc nhập lý do)\n* **BF25-UC05-WF04**: Modal Xác nhận thay đổi người phê duyệt\n\n##### Bảng Đặc tả Từ điển Trường Dữ liệu (Screen Data Dictionary):\n\n| Component Name | Data Type | Validation rules (M/O/C) | Editable (Y/N) | Other Validation | Action rules |\n|---|---|:---:|:---:|---|---|\n| **Bảng Đối chiếu So sánh CŨ - MỚI** | Dual Column Grid | M | N | Readonly | Hiển thị song song: Cột trái (Dữ liệu CŨ đang áp dụng), Cột phải (Dữ liệu MỚI đề xuất). Tự động highlight viền cam các trường có sự thay đổi. |\n| **Nút [✔ Phê duyệt]** | Button | M | Y | Click | Chỉ hiển thị với Checker (và Checker $\\ne$ Maker). Bấm để kích hoạt biểu phí. |\n| **Nút [✖ Từ chối]** | Button | M | Y | Click | Mở Modal yêu cầu nhập lý do từ chối trước khi chuyển trạng thái hồ sơ. |\n| **Lý do từ chối (Textarea)** | Textbox | M (Khi từ chối) | Y | String $\\ge 10$ chars | Bắt buộc nhập giải trình tối thiểu 10 ký tự lý do không duyệt để Maker có cơ sở chỉnh sửa. |\n| **Modal [Thay đổi người PD]** | Modal Dropdown | C | Y | Select single | Danh sách chọn Checker thay thế. Ràng buộc Checker mới không trùng với Maker tạo bản ghi. |\n\n---\n\n#### 2.6.3 Yêu cầu nghiệp vụ chung\n\n```text\n┌─────────────────┐             ┌─────────────────┐             ┌─────────────────┐\n│      MAKER      │             │   EPAY SYSTEM   │             │     CHECKER     │\n└────────┬────────┘             └────────┬────────┘             └────────┬────────┘\n         │                               │                               │\n         │  1. Gửi yêu cầu phê duyệt     │                               │\n         ├──────────────────────────────>│                               │\n         │                               │  2. Sinh YCPD (Pending)       │\n         │                               │     Cập nhật CHP (Pending)    │\n         │                               ├──────────────────────────────>│ (Gửi thông báo)\n         │                               │                               │\n         │                               │  3. Mở Thẩm định CŨ - MỚI     │\n         │                               │<──────────────────────────────┤\n         │                               │                               │\n         │                               │  4A. [PHÊ DUYỆT]              │\n         │                               │<──────────────────────────────┤\n         │  5A. Thông báo Duyệt thành công│     - YCPD = Approval         │\n         │<──────────────────────────────┤     - CHP = ACTIVE / READY    │\n         │                               │                               │\n         │                               │  4B. [TỪ CHỐI + Lý do]        │\n         │                               │<──────────────────────────────┤\n         │  5B. Báo Từ chối kèm lý do   │     - YCPD = Rejected         │\n         │<──────────────────────────────┤     - CHP = NEW / REJECTED    │\n         │                               │                               │\n```\n\n---\n\n#### 2.6.4 Quy tắc lưu thông tin phê duyệt\n\nBảng định danh chuẩn các loại Yêu cầu Phê duyệt (YCPD) được hệ thống tự động khởi tạo theo từng trạng thái và hành động thao tác của Maker:\n\n| Trạng thái hiện tại | Ý nghĩa | Hành động thao tác | Loại yêu cầu phê duyệt được tạo ra |\n|---|---|---|---|\n| **New** | Maker muốn gửi yêu cầu gửi phê duyệt CHP | Gửi yêu cầu phê duyệt | **Duyệt mở tạo hồ sơ CHP Trả đối tác** |\n| **Active** | Maker muốn gửi yêu cầu gửi phê duyệt cập nhật CHP | Gửi phê duyệt cập nhật thông tin | **Duyệt cập nhật hồ sơ CHP Trả đối tác** |\n| **Active** | Maker muốn gửi yêu cầu gửi phê duyệt tạm dừng CHP | Gửi yêu cầu tạm dừng | **Duyệt tạm dừng hồ sơ CHP Trả đối tác** |\n| **Inactive** | Maker muốn gửi yêu cầu gửi phê duyệt mở kích hoạt CHP | Gửi yêu cầu mở kích hoạt | **Duyệt mở kích hoạt CHP Trả đối tác** |\n\n---\n\n#### 2.6.5 Quy tắc ghi nhận log
