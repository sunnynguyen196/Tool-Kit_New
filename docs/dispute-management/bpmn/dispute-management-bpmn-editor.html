  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

<script>
  // Mỗi process {slug, title, xml}. Modeler cho phép sửa; nhớ Tải/Lưu trước khi đổi process.
  var PROCESSES = [{"slug":"tcycts-state-flow","title":"Luồng 1: TCYCTS Chiều TCNL Thanh toán (Có duyệt nội bộ YCPD)","xml":"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" id=\"Def_1\" targetNamespace=\"http://bpmn.io/schema/bpmn\">\n  <bpmn:collaboration id=\"Collaboration_1\">\n    <bpmn:participant id=\"Participant_1\" name=\"Luồng Trạng thái 1 Yêu cầu Tra soát (TCYCTS)\" processRef=\"Process_tcycts_state_flow\"/>\n  </bpmn:collaboration>\n  <bpmn:process id=\"Process_tcycts_state_flow\" isExecutable=\"false\">\n    <bpmn:laneSet id=\"LaneSet_1\">\n      <bpmn:lane id=\"Lane_YCPD\" name=\"YCPD (Phê duyệt Nội bộ TCYCTS)\"><bpmn:flowNodeRef>Start_1</bpmn:flowNodeRef><bpmn:flowNodeRef>Task_ApprovePending</bpmn:flowNodeRef><bpmn:flowNodeRef>GW_Approve</bpmn:flowNodeRef><bpmn:flowNodeRef>End_Cancel</bpmn:flowNodeRef><bpmn:flowNodeRef>Task_Approved</bpmn:flowNodeRef></bpmn:lane>\n      <bpmn:lane id=\"Lane_YCTS\" name=\"YCTS (Xử lý phát hành Cổng QR / Napas)\"><bpmn:flowNodeRef>Task_SendQR</bpmn:flowNodeRef><bpmn:flowNodeRef>GW_ValQR</bpmn:flowNodeRef><bpmn:flowNodeRef>End_Failure1</bpmn:flowNodeRef><bpmn:flowNodeRef>Task_Init</bpmn:flowNodeRef><bpmn:flowNodeRef>Task_SendNP</bpmn:flowNodeRef><bpmn:flowNodeRef>GW_ValNP</bpmn:flowNodeRef><bpmn:flowNodeRef>End_Failure2</bpmn:flowNodeRef><bpmn:flowNodeRef>Task_OPEN</bpmn:flowNodeRef><bpmn:flowNodeRef>GW_NPResponse</bpmn:flowNodeRef><bpmn:flowNodeRef>End_PRCD</bpmn:flowNodeRef><bpmn:flowNodeRef>End_RJCD</bpmn:flowNodeRef><bpmn:flowNodeRef>End_EXPI</bpmn:flowNodeRef><bpmn:flowNodeRef>End_EXPR</bpmn:flowNodeRef><bpmn:flowNodeRef>End_EXRJ</bpmn:flowNodeRef></bpmn:lane>\n    </bpmn:laneSet>\n    <bpmn:startEvent id=\"Start_1\" name=\"1. MM tạo YCTS\"><bpmn:outgoing>Flow_1</bpmn:outgoing></bpmn:startEvent>\n    <bpmn:task id=\"Task_ApprovePending\" name=\"Trạng thái: Approve Pending\"><bpmn:incoming>Flow_1</bpmn:incoming><bpmn:outgoing>Flow_2</bpmn:outgoing></bpmn:task>\n    <bpmn:exclusiveGateway id=\"GW_Approve\" name=\"Phê duyệt nội bộ?\"><bpmn:incoming>Flow_2</bpmn:incoming><bpmn:outgoing>Flow_3</bpmn:outgoing><bpmn:outgoing>Flow_4</bpmn:outgoing></bpmn:exclusiveGateway>\n    <bpmn:endEvent id=\"End_Cancel\" name=\"Trạng thái: Cancel (Hủy YC)\"><bpmn:incoming>Flow_3</bpmn:incoming></bpmn:endEvent>\n    <bpmn:task id=\"Task_Approved\" name=\"Trạng thái: Approved\"><bpmn:incoming>Flow_4</bpmn:incoming><bpmn:outgoing>Flow_5</bpmn:outgoing></bpmn:task>\n    <bpmn:task id=\"Task_SendQR\" name=\"Gửi YCTS sang QR\"><bpmn:incoming>Flow_5</bpmn:incoming><bpmn:outgoing>Flow_6</bpmn:outgoing></bpmn:task>\n    <bpmn:exclusiveGateway id=\"GW_ValQR\" name=\"Kiểm tra QR\"><bpmn:incoming>Flow_6</bpmn:incoming><bpmn:outgoing>Flow_7</bpmn:outgoing><bpmn:outgoing>Flow_8</bpmn:outgoing></bpmn:exclusiveGateway>\n    <bpmn:endEvent id=\"End_Failure1\" name=\"Lỗi Validation QR (Failure)\"><bpmn:incoming>Flow_7</bpmn:incoming></bpmn:endEvent>\n    <bpmn:task id=\"Task_Init\" name=\"Trạng thái: Initialization\"><bpmn:incoming>Flow_8</bpmn:incoming><bpmn:outgoing>Flow_9</bpmn:outgoing></bpmn:task>\n    <bpmn:task id=\"Task_SendNP\" name=\"2. Gửi YC sang NP (Napas)\"><bpmn:incoming>Flow_9</bpmn:incoming><bpmn:outgoing>Flow_10</bpmn:outgoing></bpmn:task>\n    <bpmn:exclusiveGateway id=\"GW_ValNP\" name=\"Kiểm tra Napas\"><bpmn:incoming>Flow_10</bpmn:incoming><bpmn:outgoing>Flow_11</bpmn:outgoing><bpmn:outgoing>Flow_12</bpmn:outgoing></bpmn:exclusiveGateway>\n    <bpmn:endEvent id=\"End_Failure2\" name=\"Lỗi Validation Napas (Failure)\"><bpmn:incoming>Flow_11</bpmn:incoming></bpmn:endEvent>\n    <bpmn:task id=\"Task_OPEN\" name=\"Trạng thái: OPEN (Đang mở YC)\"><bpmn:incoming>Flow_12</bpmn:incoming><bpmn:outgoing>Flow_13</bpmn:outgoing></bpmn:task>\n    <bpmn:exclusiveGateway id=\"GW_NPResponse\" name=\"3. Kết quả Napas\"><bpmn:incoming>Flow_13</bpmn:incoming><bpmn:outgoing>Flow_14</bpmn:outgoing><bpmn:outgoing>Flow_15</bpmn:outgoing><bpmn:outgoing>Flow_16</bpmn:outgoing><bpmn:outgoing>Flow_17</bpmn:outgoing><bpmn:outgoing>Flow_18</bpmn:outgoing></bpmn:exclusiveGateway>\n    <bpmn:endEvent id=\"End_PRCD\" name=\"Trạng thái: PRCD (Đồng ý)\"><bpmn:incoming>Flow_14</bpmn:incoming></bpmn:endEvent>\n    <bpmn:endEvent id=\"End_RJCD\" name=\"Trạng thái: RJCD (Từ chối)\"><bpmn:incoming>Flow_15</bpmn:incoming></bpmn:endEvent>\n    <bpmn:endEvent id=\"End_EXPI\" name=\"Trạng thái: EXPI (Hết hạn SLA)\"><bpmn:incoming>Flow_16</bpmn:incoming></bpmn:endEvent>\n    <bpmn:endEvent id=\"End_EXPR\" name=\"Trạng thái: EXPR (Từ chối sau HH)\"><bpmn:incoming>Flow_17</bpmn:incoming></bpmn:endEvent>\n    <bpmn:endEvent id=\"End_EXRJ\" name=\"Trạng thái: EXRJ (Đồng ý sau HH)\"><bpmn:incoming>Flow_18</bpmn:incoming></bpmn:endEvent>\n    <bpmn:sequenceFlow id=\"Flow_1\" name=\"\" sourceRef=\"Start_1\" targetRef=\"Task_ApprovePending\"/>\n    <bpmn:sequenceFlow id=\"Flow_2\" name=\"\" sourceRef=\"Task_ApprovePending\" targetRef=\"GW_Approve\"/>\n    <bpmn:sequenceFlow id=\"Flow_3\" name=\"Từ chối\" sourceRef=\"GW_Approve\" targetRef=\"End_Cancel\"/>\n    <bpmn:sequenceFlow id=\"Flow_4\" name=\"Đồng ý\" sourceRef=\"GW_Approve\" targetRef=\"Task_Approved\"/>\n    <bpmn:sequenceFlow id=\"Flow_5\" name=\"\" sourceRef=\"Task_Approved\" targetRef=\"Task_SendQR\"/>\n    <bpmn:sequenceFlow id=\"Flow_6\" name=\"\" sourceRef=\"Task_SendQR\" targetRef=\"GW_ValQR\"/>\n    <bpmn:sequenceFlow id=\"Flow_7\" name=\"Không hợp lệ\" sourceRef=\"GW_ValQR\" targetRef=\"End_Failure1\"/>\n    <bpmn:sequenceFlow id=\"Flow_8\" name=\"Hợp lệ\" sourceRef=\"GW_ValQR\" targetRef=\"Task_Init\"/>\n    <bpmn:sequenceFlow id=\"Flow_9\" name=\"\" sourceRef=\"Task_Init\" targetRef=\"Task_SendNP\"/>\n    <bpmn:sequenceFlow id=\"Flow_10\" name=\"\" sourceRef=\"Task_SendNP\" targetRef=\"GW_ValNP\"/>\n    <bpmn:sequenceFlow id=\"Flow_11\" name=\"Không hợp lệ\" sourceRef=\"GW_ValNP\" targetRef=\"End_Failure2\"/>\n    <bpmn:sequenceFlow id=\"Flow_12\" name=\"Hợp lệ\" sourceRef=\"GW_ValNP\" targetRef=\"Task_OPEN\"/>\n    <bpmn:sequenceFlow id=\"Flow_13\" name=\"\" sourceRef=\"Task_OPEN\" targetRef=\"GW_NPResponse\"/>\n    <bpmn:sequenceFlow id=\"Flow_14\" name=\"Đồng ý\" sourceRef=\"GW_NPResponse\" targetRef=\"End_PRCD\"/>\n    <bpmn:sequenceFlow id=\"Flow_15\" name=\"Từ chối\" sourceRef=\"GW_NPResponse\" targetRef=\"End_RJCD\"/>\n    <bpmn:sequenceFlow id=\"Flow_16\" name=\"Hết hạn\" sourceRef=\"GW_NPResponse\" targetRef=\"End_EXPI\"/>\n    <bpmn:sequenceFlow id=\"Flow_17\" name=\"Từ chối sau HH\" sourceRef=\"GW_NPResponse\" targetRef=\"End_EXPR\"/>\n    <bpmn:sequenceFlow id=\"Flow_18\" name=\"Đồng ý sau HH\" sourceRef=\"GW_NPResponse\" targetRef=\"End_EXRJ\"/>\n  </bpmn:process>\n  <bpmndi:BPMNDiagram id=\"Diagram_1\">\n    <bpmndi:BPMNPlane id=\"Plane_1\" bpmnElement=\"Collaboration_1\">\n      <bpmndi:BPMNShape bpmnElement=\"Participant_1\" isHorizontal=\"false\"><dc:Bounds x=\"0\" y=\"0\" width=\"1600\" height=\"1400\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"Lane_YCPD\" isHorizontal=\"false\"><dc:Bounds x=\"0\" y=\"30\" width=\"400\" height=\"1370\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"Lane_YCTS\" isHorizontal=\"false\"><dc:Bounds x=\"400\" y=\"30\" width=\"1200\" height=\"1370\"/></bpmndi:BPMNShape>\n      \n      <!-- Nodes in YCPD -->\n      <bpmndi:BPMNShape bpmnElement=\"Start_1\"><dc:Bounds x=\"182\" y=\"80\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"Task_ApprovePending\"><dc:Bounds x=\"130\" y=\"160\" width=\"140\" height=\"65\"/></bpmndi:BPMNShape>\n      \n      <bpmndi:BPMNShape bpmnElement=\"GW_Approve\">\n        <dc:Bounds x=\"175\" y=\"270\" width=\"50\" height=\"50\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"65\" y=\"285\" width=\"100\" height=\"20\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNShape>\n      \n      <bpmndi:BPMNShape bpmnElement=\"End_Cancel\"><dc:Bounds x=\"60\" y=\"370\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"Task_Approved\"><dc:Bounds x=\"240\" y=\"355\" width=\"130\" height=\"65\"/></bpmndi:BPMNShape>\n      \n      <!-- Nodes in YCTS -->\n      <bpmndi:BPMNShape bpmnElement=\"Task_SendQR\"><dc:Bounds x=\"500\" y=\"455\" width=\"140\" height=\"65\"/></bpmndi:BPMNShape>\n      \n      <!-- GATEWAY QR LABEL PLACED ON THE LEFT (X=445 Y=580) -->\n      <bpmndi:BPMNShape bpmnElement=\"GW_ValQR\">\n        <dc:Bounds x=\"545\" y=\"565\" width=\"50\" height=\"50\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"445\" y=\"580\" width=\"90\" height=\"20\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNShape>\n      \n      <bpmndi:BPMNShape bpmnElement=\"End_Failure1\"><dc:Bounds x=\"740\" y=\"572\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"Task_Init\"><dc:Bounds x=\"500\" y=\"675\" width=\"140\" height=\"65\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"Task_SendNP\"><dc:Bounds x=\"500\" y=\"785\" width=\"140\" height=\"65\"/></bpmndi:BPMNShape>\n      \n      <!-- GATEWAY NAPAS LABEL PLACED ON THE LEFT (X=435 Y=910) -->\n      <bpmndi:BPMNShape bpmnElement=\"GW_ValNP\">\n        <dc:Bounds x=\"545\" y=\"895\" width=\"50\" height=\"50\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"435\" y=\"910\" width=\"100\" height=\"20\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNShape>\n      \n      <bpmndi:BPMNShape bpmnElement=\"End_Failure2\"><dc:Bounds x=\"740\" y=\"902\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"Task_OPEN\"><dc:Bounds x=\"500\" y=\"1005\" width=\"140\" height=\"65\"/></bpmndi:BPMNShape>\n      \n      <!-- GATEWAY RESPONSE LABEL PLACED ON TOP OF THE INCOMING UPPER BRANCH (X=710 Y=1075) -->\n      <bpmndi:BPMNShape bpmnElement=\"GW_NPResponse\">\n        <dc:Bounds x=\"925\" y=\"1120\" width=\"50\" height=\"50\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"710\" y=\"1075\" width=\"120\" height=\"20\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNShape>\n      \n      <!-- Outcomes in YCTS -->\n      <bpmndi:BPMNShape bpmnElement=\"End_PRCD\"><dc:Bounds x=\"450\" y=\"1260\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_RJCD\"><dc:Bounds x=\"700\" y=\"1260\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_EXPI\"><dc:Bounds x=\"932\" y=\"1260\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_EXPR\"><dc:Bounds x=\"1170\" y=\"1260\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_EXRJ\"><dc:Bounds x=\"1420\" y=\"1260\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      \n      <!-- EDGES WITH PERFECT NON-OVERLAPPING LABEL POSITIONS -->\n      <!-- Flow 1: Start -> ApprovePending -->\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_1\"><di:waypoint x=\"200\" y=\"116\"/><di:waypoint x=\"200\" y=\"160\"/></bpmndi:BPMNEdge>\n      \n      <!-- Flow 2: ApprovePending -> GW_Approve -->\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_2\"><di:waypoint x=\"200\" y=\"225\"/><di:waypoint x=\"200\" y=\"270\"/></bpmndi:BPMNEdge>\n      \n      <!-- Flow 3: GW_Approve -> End_Cancel (Left) -->\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_3\">\n        <di:waypoint x=\"175\" y=\"295\"/><di:waypoint x=\"78\" y=\"295\"/><di:waypoint x=\"78\" y=\"370\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"105\" y=\"275\" width=\"40\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      \n      <!-- Flow 4: GW_Approve -> Task_Approved (Right) -->\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_4\">\n        <di:waypoint x=\"225\" y=\"295\"/><di:waypoint x=\"305\" y=\"295\"/><di:waypoint x=\"305\" y=\"355\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"245\" y=\"275\" width=\"40\" height=\"14\"/></bp "715\" width=\"120\" height=\"20\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNShape>\n      \n      <!-- Outcomes -->\n      <bpmndi:BPMNShape bpmnElement=\"End_EXPI\"><dc:Bounds x=\"250\" y=\"840\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_PRCD\"><dc:Bounds x=\"545\" y=\"840\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_RJCD\"><dc:Bounds x=\"795\" y=\"840\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_EXPR\"><dc:Bounds x=\"1045\" y=\"840\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape bpmnElement=\"End_EXRJ\"><dc:Bounds x=\"1295\" y=\"840\" width=\"36\" height=\"36\"/></bpmndi:BPMNShape>\n      \n      <!-- EDGES -->\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_1\"><di:waypoint x=\"565\" y=\"106\"/><di:waypoint x=\"565\" y=\"150\"/></bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_2\">\n        <di:waypoint x=\"590\" y=\"175\"/><di:waypoint x=\"735\" y=\"175\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"620\" y=\"155\" width=\"75\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_3\">\n        <di:waypoint x=\"565\" y=\"200\"/><di:waypoint x=\"565\" y=\"260\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"575\" y=\"220\" width=\"35\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      \n      <bpmndi:BPMNEdge bpmnElement=\"Flow_4\"><di:waypoint x=\"565\" y=\"325\"/><di:waypoint x=\"565\" y=\"370\"/></bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_5\"><di:waypoint x=\"565\" y=\"435\"/><di:waypoint x=\"565\" y=\"480\"/></bpmndi:BPMNEdge>\n      \n      <bpmndi:BPMNEdge bpmnElement=\"Flow_6\">\n        <di:waypoint x=\"590\" y=\"505\"/><di:waypoint x=\"735\" y=\"505\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"620\" y=\"485\" width=\"75\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_7\">\n        <di:waypoint x=\"565\" y=\"530\"/><di:waypoint x=\"565\" y=\"590\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"575\" y=\"550\" width=\"35\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      \n      <bpmndi:BPMNEdge bpmnElement=\"Flow_8\">\n        <di:waypoint x=\"565\" y=\"655\"/><di:waypoint x=\"565\" y=\"675\"/><di:waypoint x=\"945\" y=\"675\"/><di:waypoint x=\"945\" y=\"700\"/>\n      </bpmndi:BPMNEdge>\n      \n      <bpmndi:BPMNEdge bpmnElement=\"Flow_9\">\n        <di:waypoint x=\"920\" y=\"725\"/><di:waypoint x=\"268\" y=\"725\"/><di:waypoint x=\"268\" y=\"840\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"350\" y=\"705\" width=\"115\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_10\">\n        <di:waypoint x=\"920\" y=\"725\"/><di:waypoint x=\"563\" y=\"725\"/><di:waypoint x=\"563\" y=\"840\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"630\" y=\"705\" width=\"40\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_11\">\n        <di:waypoint x=\"920\" y=\"725\"/><di:waypoint x=\"813\" y=\"725\"/><di:waypoint x=\"813\" y=\"840\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"830\" y=\"760\" width=\"40\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_12\">\n        <di:waypoint x=\"970\" y=\"725\"/><di:waypoint x=\"1063\" y=\"725\"/><di:waypoint x=\"1063\" y=\"840\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"1070\" y=\"760\" width=\"90\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_13\">\n        <di:waypoint x=\"970\" y=\"725\"/><di:waypoint x=\"1313\" y=\"725\"/><di:waypoint x=\"1313\" y=\"840\"/>\n        <bpmndi:BPMNLabel><dc:Bounds x=\"1170\" y=\"705\" width=\"90\" height=\"14\"/></bpmndi:BPMNLabel>\n      </bpmndi:BPMNEdge>\n    </bpmndi:BPMNPlane>\n  </bpmndi:BPMNDiagram>\n</bpmn:definitions>"}];

  var modeler = new BpmnJS({ container: '#canvas' });
  var current = null;           // process đang mở
  var dirty = false;            // có sửa chưa lưu
  var fileHandles = {};         // slug → FileSystemFileHandle (nếu đã chọn/mở qua FS API)

  var picker = document.getElementById('picker');
  PROCESSES.forEach(function (p) {
    var o = document.createElement('option');
    o.value = p.slug; o.textContent = p.title;
    picker.appendChild(o);
  });
  picker.addEventListener('change', function () {
    if (dirty && !confirm('Process này có thay đổi chưa lưu. Đổi sẽ mất. Tiếp tục?')) {
      picker.value = current.slug; return;
    }
    location.hash = picker.value;
  });

  function setDirty(v) { dirty = v; document.getElementById('dirty').style.display = v ? 'inline' : 'none'; }

  function show(slug) {
    var p = PROCESSES.filter(function (x) { return x.slug === slug; })[0] || PROCESSES[0];
    if (!p) return;
    current = p; picker.value = p.slug;
    document.title = 'BPMN — ' + p.title;
    document.getElementById('err').style.display = 'none';
    modeler.importXML(p.xml).then(function () {
      zoomFit(); setDirty(false);
      // đánh dấu dirty khi user sửa
      modeler.on('commandStack.changed', function () { setDirty(true); });
    }).catch(function (e) {
      var el = document.getElementById('err');
      el.style.display = 'block';
      el.textContent = 'Lỗi render "' + p.title + '":\n' + (e && e.message ? e.message : e) +
        (e && e.warnings ? '\n\nWarnings:\n' + JSON.stringify(e.warnings, null, 2) : '');
      console.error(e);
    });
  }

  // Lấy XML hiện tại (đã sửa) từ modeler
  function currentXml() {
    return modeler.saveXML({ format: true }).then(function (r) { return r.xml; });
  }

  // Tải file .bpmn về máy (chế độ đơn giản — không cần server)
  window.download = function () {
    currentXml().then(function (xml) {
      var blob = new Blob([xml], { type: 'application/xml' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = current.slug + '.bpmn';
      a.click(); URL.revokeObjectURL(a.href);
      setDirty(false);
    });
  };

  // Lưu ghi đè file gốc (cần File System Access API — Chrome/Edge, chạy qua http(s) hoặc file mở qua picker)
  window.saveToFile = function () {
    currentXml().then(function (xml) {
      if (!window.showSaveFilePicker) {
        alert('Trình duyệt không hỗ trợ ghi file trực tiếp.\nDùng nút "⬇ Tải .bpmn" rồi chép đè vào repo,\nhoặc chạy qua server (xem hướng dẫn cuối file HTML).');
        return;
      }
      var h = fileHandles[current.slug];
      var chain = h ? Promise.resolve(h) : window.showSaveFilePicker({
        suggestedName: current.slug + '.bpmn',
        types: [{ description: 'BPMN', accept: { 'application/xml': ['.bpmn'] } }]
      }).then(function (handle) { fileHandles[current.slug] = handle; return handle; });
      chain.then(function (handle) {
        return handle.createWritable().then(function (w) {
          return w.write(xml).then(function () { return w.close(); });
        });
      }).then(function () { setDirty(false); }).catch(function (e) { if (e.name !== 'AbortError') alert('Lưu lỗi: ' + e.message); });
    });
  };

  window.zoomFit = function () { modeler.get('canvas').zoom('fit-viewport', 'auto'); };
  window.zoomIn  = function () { modeler.get('zoomScroll').stepZoom(1); };
  window.zoomOut = function () { modeler.get('zoomScroll').stepZoom(-1); };
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  show(location.hash.slice(1) || (PROCESSES[0] && PROCESSES[0].slug));
</script>

  1. Double-click file này → mở trình duyệt → KÉO-THẢ sửa như bpmn.io (thêm/xóa node, đổi nhãn, vẽ mũi tên).
  2. Giữ thay đổi:
     • "⬇ Tải .bpmn"  → tải file đã sửa về máy, chép đè vào docs/{feature}/bpmn/{slug}.bpmn (LUÔN dùng được).
     • "💾 Lưu"        → ghi đè trực tiếp (Chrome/Edge, lần đầu chọn đúng file gốc). Cần chạy qua server:
         cd docs/{feature}/bpmn && npx serve   (rồi mở http://localhost:3000/_viewer.html)
  3. Sau khi sửa tay + lưu .bpmn: KHÔNG chạy lại `node bpmn-build.mjs` (sẽ regen đè mất sửa tay).
